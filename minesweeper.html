<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Minesweeper — DWG MS-01</title>
<style>
  :root {
    /* diazo print — blue ink on pale paper */
    --bg: #eef3f7;
    --bg-line: rgba(20, 38, 59, 0.07);
    --panel: #ffffff;
    --panel-2: #dfe8ef;
    --panel-3: #cddbe6;
    --line: #b9c9d6;
    --line-strong: #8fa6b8;
    --ink: #14263b;
    --ink-dim: #5b7086;
    --accent: #1f6f8f;
    --accent-soft: rgba(31, 111, 143, 0.14);
    --danger: #c0392b;
    --danger-soft: rgba(192, 57, 43, 0.14);
    --flag: #b9720c;
    --n1: #1f6f8f;
    --n2: #2f7d4f;
    --n3: #c0392b;
    --n4: #5b4a9e;
    --n5: #b9720c;
    --n6: #1a8a8a;
    --n7: #14263b;
    --n8: #5b7086;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* cyanotype blueprint — cyan ink on navy */
      --bg: #0c1a29;
      --bg-line: rgba(255, 255, 255, 0.05);
      --panel: #12233a;
      --panel-2: #1a3150;
      --panel-3: #24405f;
      --line: rgba(255, 255, 255, 0.14);
      --line-strong: rgba(255, 255, 255, 0.28);
      --ink: #eaf3fa;
      --ink-dim: #86a2ba;
      --accent: #5fd4ff;
      --accent-soft: rgba(95, 212, 255, 0.14);
      --danger: #ff6b5b;
      --danger-soft: rgba(255, 107, 91, 0.16);
      --flag: #ffb648;
      --n1: #5fd4ff;
      --n2: #6fe3a0;
      --n3: #ff6b5b;
      --n4: #b6a3ff;
      --n5: #ffb648;
      --n6: #4fe0e0;
      --n7: #eaf3fa;
      --n8: #86a2ba;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1a29;
    --bg-line: rgba(255, 255, 255, 0.05);
    --panel: #12233a;
    --panel-2: #1a3150;
    --panel-3: #24405f;
    --line: rgba(255, 255, 255, 0.14);
    --line-strong: rgba(255, 255, 255, 0.28);
    --ink: #eaf3fa;
    --ink-dim: #86a2ba;
    --accent: #5fd4ff;
    --accent-soft: rgba(95, 212, 255, 0.14);
    --danger: #ff6b5b;
    --danger-soft: rgba(255, 107, 91, 0.16);
    --flag: #ffb648;
    --n1: #5fd4ff; --n2: #6fe3a0; --n3: #ff6b5b; --n4: #b6a3ff;
    --n5: #ffb648; --n6: #4fe0e0; --n7: #eaf3fa; --n8: #86a2ba;
  }
  :root[data-theme="light"] {
    --bg: #eef3f7;
    --bg-line: rgba(20, 38, 59, 0.07);
    --panel: #ffffff;
    --panel-2: #dfe8ef;
    --panel-3: #cddbe6;
    --line: #b9c9d6;
    --line-strong: #8fa6b8;
    --ink: #14263b;
    --ink-dim: #5b7086;
    --accent: #1f6f8f;
    --accent-soft: rgba(31, 111, 143, 0.14);
    --danger: #c0392b;
    --danger-soft: rgba(192, 57, 43, 0.14);
    --flag: #b9720c;
    --n1: #1f6f8f; --n2: #2f7d4f; --n3: #c0392b; --n4: #5b4a9e;
    --n5: #b9720c; --n6: #1a8a8a; --n7: #14263b; --n8: #5b7086;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background:
      repeating-linear-gradient(0deg, var(--bg-line) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, var(--bg-line) 0 1px, transparent 1px 24px),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  #sheet {
    max-width: 620px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 22px 16px 44px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- Title block ---------- */
  .titleblock {
    border: 1.5px solid var(--line-strong);
    border-radius: 3px;
    background: var(--panel);
  }
  .tb-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .tb-mark { color: var(--danger); font-size: 1.1rem; line-height: 1; }
  .tb-main h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .tb-sub {
    margin: 0 0 0 auto;
    color: var(--ink-dim);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    align-self: center;
  }
  .tb-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .tb-field {
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 1px solid var(--line);
  }
  .tb-field:last-child { border-right: none; }
  .tb-label {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .tb-value {
    font-size: 0.95rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Control panels ---------- */
  .panel {
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    padding: 12px 14px;
  }
  .spec-label {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 8px;
  }
  .toggle-group, .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggle-btn {
    padding: 8px 14px;
    border-radius: 3px;
    border: 1px solid var(--line-strong);
    background: var(--panel-2);
    color: var(--ink-dim);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    user-select: none;
  }
  .toggle-btn.selected {
    background: var(--accent);
    color: var(--panel);
    border-color: var(--accent);
  }
  .footnote {
    color: var(--ink-dim);
    font-size: 0.76rem;
    line-height: 1.4;
    margin: 10px 0 0;
  }
  .btn-row { }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border-radius: 3px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .mode-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  button:focus-visible, .toggle-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Status banner ---------- */
  .status-banner {
    display: none;
    text-align: center;
    padding: 11px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    border: 1px solid transparent;
  }
  .status-banner.show { display: block; }
  .status-win { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .status-lose { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

  /* ---------- HUD ---------- */
  .hud {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }
  .readout {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .readout-label {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .readout-value {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .readout.mines .readout-value { color: var(--danger); }
  .readout.timer .readout-value { color: var(--accent); }
  .reset-btn {
    width: 52px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    color: var(--ink);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
  }
  .reset-btn:active { background: var(--panel-2); }

  /* ---------- Board ---------- */
  .board-wrap {
    overflow: auto;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--panel);
    padding: 8px;
  }
  .board {
    display: grid;
    gap: 2px;
    width: max-content;
    margin: 0 auto;
    user-select: none;
    touch-action: manipulation;
  }
  .cell {
    width: 28px;
    height: 28px;
    background: var(--panel-3);
    border: none;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    padding: 0;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .cell.hidden { box-shadow: inset 0 0 0 1px var(--line); }
  .cell.hidden:active { background: var(--panel-2); }
  .cell.revealed {
    background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line);
    cursor: default;
  }
  .cell.mine-hit { background: var(--danger); color: var(--panel); }
  .cell.mine-shown { background: var(--panel-2); }
  .cell.flag { color: var(--flag); font-size: 0.95rem; }
  .cell.flag::after { content: "▲"; }
  .cell.mine::after { content: "✳"; }
  .n1 { color: var(--n1); } .n2 { color: var(--n2); } .n3 { color: var(--n3); }
  .n4 { color: var(--n4); } .n5 { color: var(--n5); } .n6 { color: var(--n6); }
  .n7 { color: var(--n7); } .n8 { color: var(--n8); }

  @media (max-width: 420px) {
    .tb-fields { grid-template-columns: 1fr; }
    .tb-field { border-right: none; border-bottom: 1px solid var(--line); }
    .tb-field:last-child { border-bottom: none; }
    .cell { width: 24px; height: 24px; font-size: 0.75rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .cell.revealed { animation: reveal-in 0.12s ease-out; }
  }
  @keyframes reveal-in {
    from { transform: scale(0.85); opacity: 0.4; }
    to { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="sheet">

  <header class="titleblock">
    <div class="tb-main">
      <span class="tb-mark">✳</span>
      <h1>Minesweeper</h1>
      <p class="tb-sub mono">DWG MS-01</p>
    </div>
    <div class="tb-fields mono">
      <div class="tb-field">
        <span class="tb-label">Grid</span>
        <span class="tb-value" id="tb-grid">9 × 9</span>
      </div>
      <div class="tb-field">
        <span class="tb-label">Mines</span>
        <span class="tb-value" id="tb-mines-spec">10</span>
      </div>
      <div class="tb-field">
        <span class="tb-label">Status</span>
        <span class="tb-value" id="tb-status">Ready</span>
      </div>
    </div>
  </header>

  <section class="panel">
    <p class="spec-label">Difficulty</p>
    <div class="toggle-group" id="difficulty-chips"></div>
  </section>

  <div class="status-banner" id="status-banner"></div>

  <section class="hud">
    <div class="readout mines">
      <span class="readout-label">Mines Left</span>
      <span class="readout-value mono" id="mine-counter">010</span>
    </div>
    <button class="reset-btn" id="btn-reset" type="button" aria-label="New game">⟲</button>
    <div class="readout timer">
      <span class="readout-label">Time</span>
      <span class="readout-value mono" id="timer-display">000</span>
    </div>
  </section>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <section class="panel">
    <p class="spec-label">Input Mode</p>
    <div class="btn-row">
      <button class="mode-btn" id="btn-mode-reveal" type="button">Reveal Tap</button>
      <button class="mode-btn" id="btn-mode-flag" type="button">Flag Tap</button>
    </div>
    <p class="footnote">Desktop: left-click to clear a cell, right-click to flag it. Touch: pick a mode above, or hold a cell to flag it regardless of mode. First click is always safe.</p>
  </section>

</div>

<script>
(function () {
  "use strict";

  var DIFFICULTIES = {
    "Beginner":     { rows: 9,  cols: 9,  mines: 10 },
    "Intermediate": { rows: 16, cols: 16, mines: 40 },
    "Expert":       { rows: 16, cols: 30, mines: 99 }
  };

  var state = {
    difficulty: "Beginner",
    rows: 9,
    cols: 9,
    mines: 10,
    grid: [],
    started: false,
    over: false,
    won: false,
    flagsUsed: 0,
    revealedCount: 0,
    timerHandle: null,
    timerSeconds: 0,
    tapMode: "reveal",
    longPressTimer: null
  };

  function $(id) { return document.getElementById(id); }

  function pad3(n) {
    n = Math.max(0, Math.min(999, n));
    return String(n).padStart(3, "0");
  }

  function updateTitleBlock() {
    $("tb-grid").textContent = state.rows + " × " + state.cols;
    $("tb-mines-spec").textContent = state.mines;
  }

  function setStatus(text) {
    $("tb-status").textContent = text;
  }

  // ---------- Difficulty chips ----------
  function renderDifficultyChips() {
    var wrap = $("difficulty-chips");
    wrap.innerHTML = "";
    Object.keys(DIFFICULTIES).forEach(function (name) {
      var chip = document.createElement("div");
      chip.className = "toggle-btn" + (state.difficulty === name ? " selected" : "");
      chip.textContent = name;
      chip.setAttribute("role", "button");
      chip.setAttribute("tabindex", "0");
      chip.addEventListener("click", function () {
        state.difficulty = name;
        var d = DIFFICULTIES[name];
        state.rows = d.rows; state.cols = d.cols; state.mines = d.mines;
        renderDifficultyChips();
        updateTitleBlock();
        newGame();
      });
      wrap.appendChild(chip);
    });
  }

  // ---------- Tap mode ----------
  function renderTapMode() {
    $("btn-mode-reveal").classList.toggle("active", state.tapMode === "reveal");
    $("btn-mode-flag").classList.toggle("active", state.tapMode === "flag");
  }
  $("btn-mode-reveal").addEventListener("click", function () { state.tapMode = "reveal"; renderTapMode(); });
  $("btn-mode-flag").addEventListener("click", function () { state.tapMode = "flag"; renderTapMode(); });

  // ---------- Game setup ----------
  function newGame() {
    stopTimer();
    state.started = false;
    state.over = false;
    state.won = false;
    state.flagsUsed = 0;
    state.revealedCount = 0;
    state.timerSeconds = 0;
    state.grid = [];
    for (var r = 0; r < state.rows; r++) {
      var row = [];
      for (var c = 0; c < state.cols; c++) {
        row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
      }
      state.grid.push(row);
    }
    $("status-banner").className = "status-banner";
    $("status-banner").textContent = "";
    $("btn-reset").textContent = "⟲";
    setStatus("Ready");
    updateMineCounter();
    updateTimerDisplay();
    renderBoard();
  }

  function placeMines(excludeR, excludeC) {
    var forbidden = new Set();
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var rr = excludeR + dr, cc = excludeC + dc;
        if (rr >= 0 && rr < state.rows && cc >= 0 && cc < state.cols) {
          forbidden.add(rr + "," + cc);
        }
      }
    }
    var placed = 0;
    while (placed < state.mines) {
      var r = Math.floor(Math.random() * state.rows);
      var c = Math.floor(Math.random() * state.cols);
      var key = r + "," + c;
      if (forbidden.has(key) || state.grid[r][c].mine) continue;
      state.grid[r][c].mine = true;
      placed++;
    }
    for (var r2 = 0; r2 < state.rows; r2++) {
      for (var c2 = 0; c2 < state.cols; c2++) {
        if (state.grid[r2][c2].mine) continue;
        var count = 0;
        for (var dr2 = -1; dr2 <= 1; dr2++) {
          for (var dc2 = -1; dc2 <= 1; dc2++) {
            if (dr2 === 0 && dc2 === 0) continue;
            var nr = r2 + dr2, nc = c2 + dc2;
            if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols && state.grid[nr][nc].mine) count++;
          }
        }
        state.grid[r2][c2].adjacent = count;
      }
    }
  }

  // ---------- Timer ----------
  function startTimer() {
    stopTimer();
    state.timerHandle = setInterval(function () {
      state.timerSeconds++;
      updateTimerDisplay();
    }, 1000);
  }
  function stopTimer() {
    if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
  }
  function updateTimerDisplay() {
    $("timer-display").textContent = pad3(state.timerSeconds);
  }
  function updateMineCounter() {
    $("mine-counter").textContent = pad3(state.mines - state.flagsUsed);
  }

  // ---------- Reveal logic ----------
  function revealCell(r, c) {
    if (state.over) return;
    var cell = state.grid[r][c];
    if (cell.revealed || cell.flagged) return;

    if (!state.started) {
      state.started = true;
      placeMines(r, c);
      startTimer();
      setStatus("In progress");
    }

    if (cell.mine) {
      cell.revealed = true;
      loseGame(r, c);
      return;
    }

    floodReveal(r, c);
    checkWin();
    renderBoard();
  }

  function floodReveal(startR, startC) {
    var stack = [[startR, startC]];
    while (stack.length) {
      var pos = stack.pop();
      var r = pos[0], c = pos[1];
      var cell = state.grid[r][c];
      if (cell.revealed || cell.flagged || cell.mine) continue;
      cell.revealed = true;
      state.revealedCount++;
      if (cell.adjacent === 0) {
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            var nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols) {
              var ncell = state.grid[nr][nc];
              if (!ncell.revealed && !ncell.flagged && !ncell.mine) stack.push([nr, nc]);
            }
          }
        }
      }
    }
  }

  function toggleFlag(r, c) {
    if (state.over) return;
    var cell = state.grid[r][c];
    if (cell.revealed) return;
    if (cell.flagged) {
      cell.flagged = false;
      state.flagsUsed--;
    } else {
      if (state.flagsUsed >= state.mines) return;
      cell.flagged = true;
      state.flagsUsed++;
    }
    updateMineCounter();
    renderBoard();
  }

  function checkWin() {
    var totalSafe = state.rows * state.cols - state.mines;
    if (state.revealedCount >= totalSafe) {
      state.over = true;
      state.won = true;
      stopTimer();
      $("btn-reset").textContent = "✓";
      setStatus("Cleared");
      var banner = $("status-banner");
      banner.className = "status-banner show status-win";
      banner.textContent = "Cleared in " + state.timerSeconds + "s — board swept.";
      // auto-flag remaining mines
      for (var r = 0; r < state.rows; r++) {
        for (var c = 0; c < state.cols; c++) {
          var cell = state.grid[r][c];
          if (cell.mine) cell.flagged = true;
        }
      }
      state.flagsUsed = state.mines;
      updateMineCounter();
    }
  }

  function loseGame(hitR, hitC) {
    state.over = true;
    state.won = false;
    stopTimer();
    $("btn-reset").textContent = "✕";
    setStatus("Detonated");
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var cell = state.grid[r][c];
        if (cell.mine) cell.revealed = true;
      }
    }
    var banner = $("status-banner");
    banner.className = "status-banner show status-lose";
    banner.textContent = "Detonated — mine hit at that cell.";
    renderBoard(hitR, hitC);
  }

  // ---------- Rendering ----------
  function renderBoard(hitR, hitC) {
    var board = $("board");
    board.style.gridTemplateColumns = "repeat(" + state.cols + ", 1fr)";
    board.innerHTML = "";
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var cell = state.grid[r][c];
        var btn = document.createElement("button");
        btn.type = "button";
        var cls = "cell";
        if (cell.revealed) {
          cls += cell.mine ? " revealed mine" : " revealed";
          if (cell.mine && r === hitR && c === hitC) cls += " mine-hit";
          else if (cell.mine) cls += " mine-shown";
        } else {
          cls += " hidden";
          if (cell.flagged) cls += " flag";
        }
        btn.className = cls;
        if (cell.revealed && !cell.mine && cell.adjacent > 0) {
          btn.textContent = cell.adjacent;
          btn.classList.add("n" + cell.adjacent);
        }
        attachCellEvents(btn, r, c);
        board.appendChild(btn);
      }
    }
  }

  function attachCellEvents(btn, r, c) {
    btn.addEventListener("click", function () {
      if (state.tapMode === "flag") toggleFlag(r, c);
      else revealCell(r, c);
    });
    btn.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      toggleFlag(r, c);
    });

    var pressTimer = null;
    var longPressed = false;
    btn.addEventListener("touchstart", function () {
      longPressed = false;
      pressTimer = setTimeout(function () {
        longPressed = true;
        toggleFlag(r, c);
        if (navigator.vibrate) navigator.vibrate(20);
      }, 450);
    }, { passive: true });
    var cancelPress = function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    btn.addEventListener("touchend", function (e) {
      if (longPressed) e.preventDefault();
      cancelPress();
    });
    btn.addEventListener("touchmove", cancelPress);
    btn.addEventListener("touchcancel", cancelPress);
  }

  $("btn-reset").addEventListener("click", newGame);

  // ---------- Init ----------
  var initial = DIFFICULTIES[state.difficulty];
  state.rows = initial.rows; state.cols = initial.cols; state.mines = initial.mines;
  renderDifficultyChips();
  renderTapMode();
  updateTitleBlock();
  newGame();
})();
</script>
</body>
</html>
