name: Alert ping

on:
  schedule:
    # 12am / 6am / 12pm / 6pm UTC.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not set" >&2
            exit 1
          fi
          curl -sS --fail-with-body \
            -H "Title: Alert ping" \
            -H "Priority: 3" \
            -H "Tags: bell" \
            -d "Hi" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "sent: Hi"
