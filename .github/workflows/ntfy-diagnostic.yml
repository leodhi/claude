name: ntfy diagnostic

# Manual only -- run this when an ntfy alert doesn't arrive, to tell apart
# "ntfy never got the message" from "ntfy has it but the phone isn't showing
# it". Publishes a stamped test message, then reads the topic back.
#
# The topic itself is never printed: only its length and a SHA-256 fingerprint,
# which is enough to compare against the topic the ntfy app is subscribed to
# without putting the real value in this public repo's logs.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Publish a stamped message and read it back
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "FAIL: NTFY_TOPIC secret is not set on this repo."
            exit 1
          fi

          echo "topic length:      ${#NTFY_TOPIC}"
          echo "topic fingerprint: $(printf %s "$NTFY_TOPIC" | sha256sum | cut -c1-12)"
          echo

          stamp="diag-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "publishing stamp: $stamp"

          # Response bodies are never printed -- they echo the topic name back.
          code=$(curl -sS -o /tmp/publish.json -w '%{http_code}' \
            -H "Title: ntfy diagnostic" \
            -H "Priority: 3" \
            -H "Tags: mag" \
            -d "$stamp" \
            "https://ntfy.sh/$NTFY_TOPIC")
          echo "publish HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "FAIL: ntfy rejected the publish."
            exit 1
          fi

          sleep 3

          poll=$(curl -sS -o /tmp/poll.json -w '%{http_code}' \
            "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=15m")
          echo "poll HTTP status:    $poll"

          # Parsed with jq rather than grepped: ntfy returns newline-delimited
          # JSON, and matching on raw text would silently miscount if the
          # spacing of that JSON ever changed.
          count=$(jq -s '[.[] | select(.event == "message")] | length' /tmp/poll.json 2>/dev/null || echo "unknown")
          echo "messages in topic in the last 15m: $count"

          if grep -q "$stamp" /tmp/poll.json; then
            echo
            echo "READBACK OK -- ntfy.sh accepted and stored the message."
            echo "So the server side is healthy end to end. If the phone still"
            echo "shows nothing, the ntfy app is either subscribed to a"
            echo "different topic than this secret, or is not permitted to"
            echo "raise notifications (permissions / battery optimisation)."
            echo "Compare the fingerprint above against the subscribed topic."
          else
            echo
            echo "READBACK FAILED -- the message was accepted but did not come"
            echo "back when polling the same topic. Treat the NTFY_TOPIC secret"
            echo "as suspect."
            exit 1
          fi
