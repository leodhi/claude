name: Metals Spike Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: metals-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run spike detector
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          LOOKBACK_MINUTES: ${{ vars.LOOKBACK_MINUTES }}
          MOVE_THRESHOLD_PCT: ${{ vars.MOVE_THRESHOLD_PCT }}
          R2_THRESHOLD: ${{ vars.R2_THRESHOLD }}
          COOLDOWN_MINUTES: ${{ vars.COOLDOWN_MINUTES }}
        run: python scripts/metals_alert.py

      - name: Commit updated alert state
        run: |
          if ! git diff --quiet -- state/alert_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/alert_state.json
            git commit -m "Update alert cooldown state"
            git push
          else
            echo "No state change, nothing to commit"
          fi
