<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Party Games</title>
<style>
  :root {
    --bg: #10151f;
    --panel: #1a2233;
    --panel-2: #232e45;
    --accent: #4ee6a7;
    --text: #eef2f9;
    --text-dim: #93a0b8;
    --border: #2c3a55;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 16px 40px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 4px 0 2px;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .game-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  a.game-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 14px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    transition: transform 0.1s, background 0.15s;
  }
  a.game-card:active { transform: scale(0.97); background: var(--panel-2); }
  a.game-card img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
  }
  .game-name {
    font-weight: 700;
    font-size: 1rem;
  }
  .game-desc {
    color: var(--text-dim);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎉 Party <span>Games</span></h1>
  <div class="subtitle">Pass-and-play games for one device, everyone at the table</div>
  <div class="game-grid">
    <a class="game-card" href="chameleon.html">
      <img src="icon-chameleon.png" alt="">
      <div class="game-name">Chameleon</div>
      <div class="game-desc">Blend in without knowing the secret word</div>
    </a>
    <a class="game-card" href="trivia.html">
      <img src="icon-trivia.png" alt="">
      <div class="game-name">Trivia Party</div>
      <div class="game-desc">Race the clock across categories</div>
    </a>
    <a class="game-card" href="doodle.html">
      <img src="icon-doodle.png" alt="">
      <div class="game-name">Doodle &amp; Guess</div>
      <div class="game-desc">Draw it, guess it</div>
    </a>
    <a class="game-card" href="firsttoworst.html">
      <img src="icon-firsttoworst.png" alt="">
      <div class="game-name">First to Worst</div>
      <div class="game-desc">Rank everything, argue about it</div>
    </a>
  </div>
</div>
</body>
</html>
