<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Lists</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9500">
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #f5f5f7;
    --ink-muted: #9a9aa2;
    --accent: #ff9500;
    --shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); overscroll-behavior-y: contain; }
  body { margin: 0; color: var(--ink); font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size: 16px; line-height: 1.4; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }

  h1 { font-weight: 700; font-size: 32px; margin: 0 0 20px; letter-spacing: -0.01em; }

  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; border: none; cursor: pointer;
    padding: 20px 18px; margin-bottom: 10px; border-radius: 14px; box-shadow: var(--shadow);
    font: inherit; font-size: 19px; font-weight: 700; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    transition: transform 0.1s ease;
  }
  .list-row:active { transform: scale(0.97); }
  .list-row .chev { opacity: 0.7; font-weight: 400; flex: none; }

  .empty-state { color: var(--ink-muted); font-size: 14px; padding: 30px 4px; }

  .fab {
    position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); right: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; font-size: 28px; line-height: 1;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); cursor: pointer; touch-action: manipulation;
    -webkit-transform: translateZ(0); transform: translateZ(0);
    transition: transform 0.1s ease;
  }
  .fab:active { transform: scale(0.94); }
</style>
</head>
<body>

<div class="wrap">
  <h1>My Lists</h1>
  <div id="list-root"></div>
</div>

<button type="button" id="fab-add" class="fab" aria-label="Create new list">+</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Same Firebase project as docs/packing-list/index.html and this folder's
  // list.html. Every list lives at packingLists/{listId} (list.html?id=...
  // reads that document directly); this page just reads a small index
  // document, packingLists/_index, that names them all.
  const firebaseConfig = {
    apiKey: "AIzaSyDFJ_4r2c5P2w4F3TJg4CRNHP-yiDsRiRQ",
    authDomain: "packing-list-3c532.firebaseapp.com",
    projectId: "packing-list-3c532",
    storageBucket: "packing-list-3c532.firebasestorage.app",
    messagingSenderId: "209304705485",
    appId: "1:209304705485:web:20c59e9f08465822c58c84"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const indexRef = doc(db, "packingLists", "_index");

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
  function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

  // Same shared-gradient technique as list.html's category cards, for a
  // consistent look between the two screens.
  const GRADIENT_BASE = { h: 8, s: 80, l: 36 };
  const GRADIENT_LIGHT_CAP = 51;
  function gradientRowColor(index, total) {
    const t = total <= 1 ? 0 : index / (total - 1);
    const hue = GRADIENT_BASE.h + t * 15;
    const light = Math.min(GRADIENT_LIGHT_CAP, GRADIENT_BASE.l + t * (GRADIENT_LIGHT_CAP - GRADIENT_BASE.l));
    return `hsl(${hue.toFixed(1)}, ${GRADIENT_BASE.s}%, ${light}%)`;
  }

  const root = document.getElementById("list-root");
  let lists = {};

  function render() {
    const entries = Object.entries(lists).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
    if (entries.length === 0) {
      root.innerHTML = '<div class="empty-state">No lists yet. Tap + to create one.</div>';
      return;
    }
    root.innerHTML = entries.map(([id, l], i) => `
      <button type="button" class="list-row" style="background:${gradientRowColor(i, entries.length)}" data-list-id="${escapeAttr(id)}" data-list-name="${escapeAttr(l.name || "")}">
        <span>${escapeHtml(l.name || "Untitled list")}</span><span class="chev">›</span>
      </button>`).join("");
  }

  root.addEventListener("click", e => {
    const btn = e.target.closest("[data-list-id]");
    if (!btn) return;
    location.href = `list.html?id=${encodeURIComponent(btn.dataset.listId)}&name=${encodeURIComponent(btn.dataset.listName)}`;
  });

  // Self-initializing: the very first time this page ever loads (no index
  // document exists yet), seed it with the one list that already existed
  // before multi-list support did, so nothing needs a manual migration
  // step and no existing data is at risk.
  let seeding = false;
  onSnapshot(indexRef, async snap => {
    if (!snap.exists()) {
      if (seeding) return;
      seeding = true;
      try {
        await setDoc(indexRef, { lists: { family: { name: "Niagara Packing List", order: 0 } } });
      } catch (err) {
        console.error(err);
      }
      return; // onSnapshot fires again once that write lands
    }
    lists = snap.data().lists || {};
    render();
  }, err => {
    console.error(err);
    root.innerHTML = '<div class="empty-state">Couldn\'t load your lists. Check your connection and reload.</div>';
  });

  document.getElementById("fab-add").addEventListener("click", async () => {
    const name = prompt("Name this list:");
    if (!name || !name.trim()) return;
    const id = uid();
    const order = Object.keys(lists).length;
    try {
      await setDoc(indexRef, { lists: { [id]: { name: name.trim(), order } } }, { merge: true });
      location.href = `list.html?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name.trim())}`;
    } catch (err) {
      console.error(err);
      alert("Couldn't create the list — try again.");
    }
  });
</script>
</body>
</html>
