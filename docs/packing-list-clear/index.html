<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Lists</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9500">
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #f5f5f7;
    --ink-muted: #9a9aa2;
    --accent: #ff9500;
    --shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); overscroll-behavior-y: contain; }
  body { margin: 0; color: var(--ink); font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size: 16px; line-height: 1.4; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }

  h1 { font-weight: 700; font-size: 32px; margin: 0 0 20px; letter-spacing: -0.01em; }

  .swipe-row { position: relative; margin-bottom: 10px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); touch-action: pan-y; }
  .bg-delete {
    position: absolute; inset: 0; background: #ff3b30; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 22px; color: #fff; font-size: 15px; font-weight: 700; opacity: 0;
  }

  .list-row {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; border: none; cursor: pointer;
    padding: 20px 18px; font: inherit; font-size: 19px; font-weight: 700; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  }
  .list-row.dragging { transition: none; }
  .list-row.snap { transition: transform 0.25s cubic-bezier(.2,.9,.3,1.2); }
  .list-row.commit { transition: transform 0.2s ease-out, opacity 0.2s ease-out; }
  .list-row.revealed { transition: transform 0.2s cubic-bezier(.2,.9,.3,1.1); }
  .bg-delete { cursor: pointer; touch-action: manipulation; }
  .list-row .chev { opacity: 0.7; font-weight: 400; flex: none; }
  .list-row-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .list-row .item-count {
    font-size: 13px; font-weight: 600; opacity: 0.85; flex: none;
    background: rgba(255,255,255,0.2); padding: 2px 9px; border-radius: 999px;
  }

  .inline-add-input-wrap { flex: 1; min-width: 0; }
  .inline-add-input {
    width: 100%; display: block; font: inherit; font-size: 19px; font-weight: 700; color: #fff;
    background: transparent; border: none; padding: 0; margin: 0; -webkit-appearance: none; appearance: none;
    font-family: inherit; line-height: inherit; resize: none; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .inline-add-input:focus { outline: none; }
  .inline-add-input::placeholder { color: rgba(255,255,255,0.65); font-weight: 700; }

  .empty-state { color: var(--ink-muted); font-size: 14px; padding: 30px 4px; }

  .trash-block { margin-top: 22px; }
  .trash-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-muted);
    background: none; border: none; padding: 10px 4px; cursor: pointer; touch-action: manipulation;
    transition: color 0.15s ease;
  }
  .trash-toggle:active { color: var(--ink); }
  .trash-chev { display: inline-block; transition: transform 0.2s cubic-bezier(.2,.9,.3,1.1); opacity: 0.7; }
  .trash-block.open .trash-chev { transform: rotate(90deg); }
  .trash-items {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s cubic-bezier(.2,.9,.3,1.1);
  }
  .trash-block.open .trash-items { grid-template-rows: 1fr; }
  .trash-items > * { overflow: hidden; }
  .trash-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 10px;
    padding: 12px 12px 12px 14px; margin-bottom: 8px;
  }
  .trash-name { font-size: 15px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trash-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .trash-restore, .trash-purge {
    font: inherit; font-size: 13px; font-weight: 700;
    background: none; border: none; cursor: pointer; padding: 6px 8px; flex: none;
    touch-action: manipulation; transition: transform 0.1s ease;
  }
  .trash-restore { color: var(--accent); }
  .trash-purge { color: #ff453a; }
  .trash-restore:active, .trash-purge:active { transform: scale(0.94); }

  .undo-toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom) + var(--vv-bottom-offset, 0px));
    max-width: 612px; margin: 0 auto;
    background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 14px;
    padding: 14px 10px 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: var(--shadow); z-index: 10;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(16px) scale(0.98);
    transition: opacity 0.25s cubic-bezier(.2,.9,.3,1.1), transform 0.25s cubic-bezier(.2,.9,.3,1.1), visibility 0s linear 0.25s;
  }
  .undo-toast.show {
    opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1);
    transition: opacity 0.25s cubic-bezier(.2,.9,.3,1.1), transform 0.25s cubic-bezier(.2,.9,.3,1.1);
  }
  .undo-toast span { font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .undo-toast button {
    font: inherit; font-weight: 700; font-size: 14px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 8px 10px; flex: none; touch-action: manipulation;
  }

  .scroll-container { position: relative; }
  .wrap.pull-snap { transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2); }
  .pull-indicator {
    position: absolute; top: 0; left: 0; right: 0; height: 0; overflow: visible;
    display: flex; justify-content: center; pointer-events: none; z-index: 5;
  }
  #pull-icon {
    margin-top: calc(14px + env(safe-area-inset-top));
    width: 38px; height: 38px; border-radius: 50%; background: #2c2c2e; border: 1px solid #3a3a3c;
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; opacity: 0; transform: scale(0.4);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  #pull-icon.ready { background: var(--accent); border-color: var(--accent); color: #fff; }
  #pull-icon.reset { transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
</style>
</head>
<body>

<div class="scroll-container">
  <div class="pull-indicator"><div id="pull-icon">+</div></div>
  <div class="wrap">
    <h1>My Lists</h1>
    <div id="list-root"></div>
  </div>
</div>

<div id="undo-toast" class="undo-toast">
  <span id="undo-toast-text"></span>
  <button type="button" id="undo-toast-btn">Undo</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, updateDoc, deleteDoc, deleteField, onSnapshot, collection, getDocsFromServer
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Same Firebase project as docs/packing-list/index.html and this folder's
  // list.html. Every list lives at packingLists/{listId} (list.html?id=...
  // reads that document directly); this page just reads a small index
  // document, packingLists/_index, that names them all.
  const firebaseConfig = {
    apiKey: "AIzaSyDFJ_4r2c5P2w4F3TJg4CRNHP-yiDsRiRQ",
    authDomain: "packing-list-3c532.firebaseapp.com",
    projectId: "packing-list-3c532",
    storageBucket: "packing-list-3c532.firebasestorage.app",
    messagingSenderId: "209304705485",
    appId: "1:209304705485:web:20c59e9f08465822c58c84"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const indexRef = doc(db, "packingLists", "_index");

  // Mobile Safari can shrink the visible viewport from the bottom (its
  // toolbar reappearing as you scroll up) without the layout viewport
  // changing, which leaves plain `position: fixed; bottom: 0` elements
  // rendered partly behind it mid-transition. Track the gap via the
  // VisualViewport API and feed it into a CSS variable so those elements
  // stay fully clear of it. Exposed as a real function (not just a
  // resize-event listener) so anything that pops up on a delay -- a modal
  // shown by a setTimeout, for instance -- can force a fresh read right
  // before it appears, rather than trusting whatever value happened to be
  // set last, which may be stale from page-load settling. Clamped to a
  // sane maximum so a bad reading can't shove something further off
  // -screen than the un-compensated bug did in the first place.
  let updateViewportInset = () => {};
  if (window.visualViewport) {
    const vv = window.visualViewport;
    updateViewportInset = () => {
      const offset = Math.max(0, Math.min(150, window.innerHeight - (vv.height + vv.offsetTop)));
      document.documentElement.style.setProperty("--vv-bottom-offset", offset + "px");
    };
    vv.addEventListener("resize", updateViewportInset);
    updateViewportInset();
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
  function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

  // Same shared-gradient technique as list.html's category cards, for a
  // consistent look between the two screens.
  const GRADIENT_BASE = { h: 8, s: 80, l: 36 };
  const GRADIENT_LIGHT_CAP = 51;
  function gradientRowColor(index, total) {
    const t = total <= 1 ? 0 : index / (total - 1);
    const hue = GRADIENT_BASE.h + t * 15;
    const light = Math.min(GRADIENT_LIGHT_CAP, GRADIENT_BASE.l + t * (GRADIENT_LIGHT_CAP - GRADIENT_BASE.l));
    return `hsl(${hue.toFixed(1)}, ${GRADIENT_BASE.s}%, ${light}%)`;
  }

  const root = document.getElementById("list-root");
  let lists = {};
  // Deleting a list keeps a record of it here (in the same index document)
  // rather than dropping it on the floor. The Undo toast only lives in
  // this page's memory, so a refresh used to make a deleted list
  // unrecoverable without reading the database by hand -- this is the
  // durable backstop for that. The list's items were always left intact in
  // packingLists/{id}; this just remembers its name so it can be put back.
  let deletedLists = {};
  // null = never toggled by hand, so it opens itself whenever there's
  // something in it. Collapsed-by-default made it easy to miss entirely
  // right when you'd be looking for it. Once toggled, the choice sticks.
  let trashOpen = null;

  // Item counts come from each list's own document, not the index (which
  // only has name/order), so a small listener per list keeps them live.
  // Kept in sync with whatever's currently in `lists` -- a list that gets
  // deleted (or its count arrives after the initial render) unsubscribes
  // or re-renders rather than leaking listeners or going stale.
  const itemCounts = {};
  const itemCountUnsubs = {};
  function syncItemCountListeners() {
    for (const id of Object.keys(lists)) {
      if (itemCountUnsubs[id]) continue;
      itemCountUnsubs[id] = onSnapshot(doc(db, "packingLists", id), snap => {
        itemCounts[id] = snap.exists() ? Object.keys(snap.data().items || {}).length : 0;
        render();
      }, err => console.error(err));
    }
    for (const id of Object.keys(itemCountUnsubs)) {
      if (id in lists) continue;
      itemCountUnsubs[id]();
      delete itemCountUnsubs[id];
      delete itemCounts[id];
    }
  }

  // A pending "new list" entry, edited inline as its own orange row (same
  // idea as adding an item on the list page) rather than a native prompt()
  // popup, which looked/felt like a totally separate window.
  let pendingAdd = false;

  function autoGrowInlineTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function renderTrashHtml() {
    const deleted = Object.entries(deletedLists).sort((a, b) => (b[1].deletedAt ?? 0) - (a[1].deletedAt ?? 0));
    if (deleted.length === 0) return "";
    const open = trashOpen === null ? true : trashOpen;
    return `
      <div class="trash-block${open ? " open" : ""}">
        <button type="button" class="trash-toggle" id="trash-toggle">
          <span>🗑 Recently deleted (${deleted.length})</span><span class="trash-chev">›</span>
        </button>
        <div class="trash-items"><div class="trash-items-inner">
          ${deleted.map(([id, e]) => `
            <div class="trash-row">
              <span class="trash-name">${escapeHtml(e.name || "Untitled list")}</span>
              <span class="trash-actions">
                <button type="button" class="trash-restore" data-restore-id="${escapeAttr(id)}">Restore</button>
                <button type="button" class="trash-purge" data-purge-id="${escapeAttr(id)}">Delete forever</button>
              </span>
            </div>`).join("")}
        </div></div>
      </div>`;
  }

  function render() {
    const entries = Object.entries(lists).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
    if (entries.length === 0 && !pendingAdd) {
      root.innerHTML = '<div class="empty-state">No lists yet. Tap anywhere to create one.</div>' + renderTrashHtml();
      return;
    }
    const rowsHtml = entries.map(([id, l], i) => `
      <div class="swipe-row" data-list-id="${escapeAttr(id)}" data-list-name="${escapeAttr(l.name || "")}">
        <div class="bg-delete">Delete</div>
        <button type="button" class="list-row" style="background:${gradientRowColor(i, entries.length)}">
          <span>${escapeHtml(l.name || "Untitled list")}</span>
          <span class="list-row-right">
            ${itemCounts[id] != null ? `<span class="item-count">${itemCounts[id]}</span>` : ""}
            <span class="chev">›</span>
          </span>
        </button>
      </div>`).join("");
    const inlineAddHtml = pendingAdd ? `
      <div class="swipe-row">
        <div class="list-row" style="background:${gradientRowColor(entries.length, entries.length + 1)}">
          <div class="inline-add-input-wrap"><textarea id="inline-add-input" class="inline-add-input" rows="1" placeholder="New list"></textarea></div>
        </div>
      </div>` : "";
    root.innerHTML = rowsHtml + inlineAddHtml + renderTrashHtml();
    // A rebuild detaches whatever row was parked open awaiting delete
    // confirmation, so the reference to it (and its close closure) goes
    // stale -- reset the tracking, not just the DOM.
    revealedListId = null;
    closeRevealedList = null;
    root.querySelectorAll(".swipe-row[data-list-id]").forEach(row => attachDeleteSwipe(row, row.dataset.listId));

    if (pendingAdd) {
      const input = document.getElementById("inline-add-input");
      autoGrowInlineTextarea(input);
      input.focus();
      input.addEventListener("input", () => autoGrowInlineTextarea(input));
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        else if (e.key === "Escape") { e.preventDefault(); input.dataset.cancelled = "1"; input.blur(); }
      });
      input.addEventListener("blur", () => {
        const cancelled = input.dataset.cancelled === "1";
        const name = input.value.trim();
        pendingAdd = false;
        if (!cancelled && name) commitNewList(name);
        // Always re-render: this used to bail out early because committing
        // navigated away. Now that it stays put, the pending row has to be
        // cleared here rather than lingering until the write's snapshot
        // lands.
        render();
      });
    }
  }

  function startInlineAdd() {
    if (pendingAdd) return;
    pendingAdd = true;
    render();
  }

  // Just blurs, WITHOUT marking cancelled, so the field's own blur handler
  // does what it does for any other blur: keep what was typed, or quietly
  // close if it's empty. Tapping away from a half-typed name should finish
  // it, exactly like pressing Enter -- throwing the text away was the
  // surprising part. Escape is still the way to abandon one.
  function dismissPendingInlineAdd() {
    const input = document.getElementById("inline-add-input");
    if (input) input.blur();
  }

  async function commitNewList(name) {
    const id = uid();
    const order = Object.keys(lists).length;
    try {
      // Registering the name in the index isn't enough on its own -- the
      // list's own document has to exist too, since list.html adds/edits
      // items with updateDoc(), which (unlike setDoc) fails if the
      // document doesn't exist yet. Without this, a brand new list looked
      // like it was created fine but silently couldn't be added to.
      await Promise.all([
        setDoc(indexRef, { lists: { [id]: { name, order } } }, { merge: true }),
        // The name is stored on the list's own document as well as in the
        // index. The index is only a convenience (names + order in one
        // read); a list that knows its own name can always be recovered
        // from it alone if the index is ever lost -- see reconcileLists().
        setDoc(doc(db, "packingLists", id), { items: {}, name })
      ]);
      // Deliberately stays on My Lists rather than opening the new list.
      // Creating one and going straight into it hijacked the screen when
      // you were only setting things up -- adding several lists in a row
      // meant getting thrown into each one and navigating back. The new
      // row appears here; tap it when you actually want to open it.
    } catch (err) {
      console.error(err);
      alert("Couldn't create the list — try again.");
    }
  }

  // Tapping anywhere while the inline-add row is open dismisses it instead
  // of doing whatever that tap would otherwise do -- capture phase, on
  // pointerdown, for the same reason this pattern is used on the list
  // page: the browser's own default blur-on-tap happens well before a
  // "click" would ever fire, so waiting for click means whatever was typed
  // already committed via the field's default (non-cancelled) blur.
  //
  // A tap landing on an existing row only cancels on that tap -- it
  // doesn't also navigate. The synchronous render() this triggers (via the
  // field's blur handler) detaches the very row element mid-dispatch,
  // which silently stops the browser's click from ever firing for it, so
  // trying to also act on it here would be unreliable. A plain second tap
  // on the now-ordinary row navigates normally right after.
  // The flag is reset on a timeout as well as on next-click consumption --
  // some targets (e.g. the undo toast's own button) call stopPropagation(),
  // so the click never reaches the listener below to clear it there. Left
  // set, it would wrongly swallow the next unrelated tap-to-add.
  let suppressNextClick = false;
  document.addEventListener("pointerdown", e => {
    if (!pendingAdd) return;
    if (e.target.closest("#inline-add-input")) return;
    suppressNextClick = true;
    setTimeout(() => { suppressNextClick = false; }, 0);
    dismissPendingInlineAdd();
  }, { capture: true });

  root.addEventListener("click", e => {
    const restoreBtn = e.target.closest("[data-restore-id]");
    if (restoreBtn) { restoreList(restoreBtn.dataset.restoreId); return; }
    const purgeBtn = e.target.closest("[data-purge-id]");
    if (purgeBtn) { purgeList(purgeBtn.dataset.purgeId); return; }
    if (e.target.closest("#trash-toggle")) {
      trashOpen = !(trashOpen === null ? true : trashOpen);
      render();
      return;
    }
    if (suppressNextRowClick) { suppressNextRowClick = false; return; }
    const row = e.target.closest("[data-list-id]");
    if (!row) return;
    // A row parked open awaiting delete confirmation isn't a navigation
    // target -- the tap that closes it shouldn't also open the list.
    if (revealedListId !== null) return;
    location.href = `list.html?id=${encodeURIComponent(row.dataset.listId)}&name=${encodeURIComponent(row.dataset.listName)}`;
  });

  // Tapping anywhere outside a row that's showing its Delete button closes
  // it without deleting. Capture phase so it beats the row/document
  // handlers, and it flags the follow-up click so that same tap doesn't
  // also open the new-list row.
  document.addEventListener("pointerdown", e => {
    if (revealedListId === null) return;
    if (e.target.closest && e.target.closest(`[data-list-id="${revealedListId}"]`)) return;
    if (closeRevealedList) closeRevealedList();
    suppressNextRowClick = true;
    suppressNextClick = true;
    setTimeout(() => { suppressNextRowClick = false; suppressNextClick = false; }, 0);
  }, { capture: true });

  // ---------- Swipe left to delete (same gesture/confirm as list items) ----------
  const SWIPE_COMMIT_PX = 84;

  // Which row (if any) is swiped open showing its Delete button, and how to
  // close it -- shared across rows so opening one closes any other, and a
  // tap anywhere else closes it without deleting.
  let revealedListId = null;
  let closeRevealedList = null;
  // Set when a tap's only effect was closing an open reveal, so that same
  // tap doesn't ALSO navigate into the list or open the new-list row.
  let suppressNextRowClick = false;

  function attachDeleteSwipe(swipeRow, id) {
    const rowFg = swipeRow.querySelector(".list-row");
    const bgDelete = swipeRow.querySelector(".bg-delete");
    let startX = 0, startY = 0, dx = 0, dragging = null;
    let pointerId = null;
    let dismissOnly = false;

    // Swiping past the threshold parks the row open rather than deleting --
    // deleting a whole list now takes a second, deliberate tap on the
    // Delete button, instead of the two stacked confirm() popups this used
    // to throw (which were easy to blow through by reflex).
    function revealForDelete() {
      if (revealedListId !== null && revealedListId !== id && closeRevealedList) closeRevealedList();
      rowFg.classList.add("revealed");
      rowFg.style.transform = `translateX(-${SWIPE_COMMIT_PX}px)`;
      bgDelete.style.opacity = "1";
      revealedListId = id;
      closeRevealedList = () => closeReveal(false);
    }

    // instant=true skips the closing animation, so a fresh drag on an
    // already-open row starts cleanly from zero rather than jumping.
    function closeReveal(instant) {
      if (instant) rowFg.classList.remove("revealed");
      rowFg.style.transform = "translateX(0)";
      bgDelete.style.opacity = "0";
      if (revealedListId === id) { revealedListId = null; closeRevealedList = null; }
      if (!instant) setTimeout(() => rowFg.classList.remove("revealed"), 220);
    }

    bgDelete.addEventListener("click", e => {
      if (revealedListId !== id) return;
      e.stopPropagation(); // don't let this bubble to the row's navigate-on-click
      const entry = lists[id];
      const name = entry ? (entry.name || "this list") : "this list";
      // A whole list is a big thing to lose, so the Delete tap asks once
      // before doing it. Just the one prompt -- the swipe already made this
      // deliberate, and two stacked prompts only teach you to tap through
      // them. Declining leaves the row parked open, so it's obvious nothing
      // happened and Delete is still right there.
      if (!confirm(`Delete "${name}"? You can restore it afterwards from Recently deleted.`)) return;
      revealedListId = null;
      closeRevealedList = null;
      rowFg.classList.remove("revealed");
      rowFg.classList.add("commit");
      rowFg.style.transform = "translateX(-100%)";
      rowFg.style.opacity = "0";
      setTimeout(() => deleteList(id, entry), 150);
    });

    rowFg.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      dismissOnly = false;
      if (revealedListId === id) {
        closeReveal(true);
        dismissOnly = true;
      } else if (revealedListId !== null && closeRevealedList) {
        closeRevealedList();
        dismissOnly = true;
      }
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = null;
      pointerId = e.pointerId;
      rowFg.classList.remove("snap", "commit");
    });

    rowFg.addEventListener("pointermove", e => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      const curDx = e.clientX - startX;
      const curDy = e.clientY - startY;
      if (dragging === null) {
        if (Math.abs(curDx) < 8 && Math.abs(curDy) < 8) return;
        dragging = Math.abs(curDx) > Math.abs(curDy);
        if (dragging) {
          if (rowFg.setPointerCapture) rowFg.setPointerCapture(pointerId);
          rowFg.classList.add("dragging");
        }
      }
      if (!dragging) return;
      e.preventDefault();
      dx = Math.min(0, curDx); // only leftward -- there's no "complete" direction for a list
      rowFg.style.transform = `translateX(${dx}px)`;
      bgDelete.style.opacity = String(Math.min(1, Math.abs(dx) / SWIPE_COMMIT_PX));
    });

    function endDrag(e) {
      if (pointerId === null) return;
      pointerId = null;
      if (dragging === null || !dragging) {
        // Plain tap. Normally the row's own click navigates into the list;
        // if this tap's only job was closing an open reveal, swallow it so
        // it doesn't navigate too.
        if (dismissOnly) {
          dismissOnly = false;
          suppressNextRowClick = true;
          setTimeout(() => { suppressNextRowClick = false; }, 0);
        }
        dragging = null;
        return;
      }
      rowFg.classList.remove("dragging");
      if (dx < -SWIPE_COMMIT_PX) {
        revealForDelete();
      } else {
        rowFg.classList.add("snap");
        rowFg.style.transform = "translateX(0)";
        bgDelete.style.opacity = "0";
      }
      dragging = null;
    }
    rowFg.addEventListener("pointerup", endDrag);
    rowFg.addEventListener("pointercancel", endDrag);
  }

  // Deleting a list only ever removes its entry from the index above --
  // its actual items are left alone in packingLists/{id}, untouched, so
  // Undo is always a full, exact restore, not just a fresh empty list.
  // There's no time limit on it: the toast stays up until you tap Undo,
  // or until a later delete replaces it with a newer one.
  async function deleteList(id, entry) {
    try {
      // One write does both halves, so a list can never be dropped from
      // the visible index without simultaneously being recorded as
      // recoverable.
      await updateDoc(indexRef, {
        [`lists.${id}`]: deleteField(),
        [`deletedLists.${id}`]: {
          name: entry ? (entry.name || "") : "",
          order: entry ? (entry.order ?? 0) : 0,
          deletedAt: Date.now()
        }
      });
      showUndoToast(id, entry);
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the list — try again.");
    }
  }

  // Put a deleted list back. Its items were never touched, so restoring the
  // index entry is a complete restore, not a fresh empty list.
  async function restoreList(id) {
    const entry = deletedLists[id];
    if (!entry) return;
    try {
      // Make sure the list's own document exists before pointing at it
      // again -- list.html adds items with updateDoc(), which fails on a
      // missing document. Deliberately writes ONLY the name: merging an
      // empty `items: {}` would depend on whether an empty map counts as
      // "leave what's there alone" or "replace it", and being wrong about
      // that would erase every item in the list being restored. A scalar
      // field can't do that. The items map doesn't need pre-creating --
      // updateDoc's dotted paths build it on first use.
      await setDoc(doc(db, "packingLists", id), { name: entry.name || "" }, { merge: true });
      await updateDoc(indexRef, {
        [`lists.${id}`]: { name: entry.name || "", order: entry.order ?? 0 },
        [`deletedLists.${id}`]: deleteField()
      });
    } catch (err) {
      console.error(err);
      alert("Couldn't restore the list — try again.");
    }
  }

  // Throw a deleted list away for good, items and all. This has to remove
  // the list's own document too, not just the trash entry: the document is
  // what reconcileLists() rebuilds from, so clearing only the entry would
  // have the list rise from the dead on the next load.
  async function purgeList(id) {
    const entry = deletedLists[id];
    if (!entry) return;
    const name = entry.name || "this list";
    if (!confirm(`Permanently delete "${name}" and everything in it? This can't be undone.`)) return;
    // Marked before the writes, not after: the snapshot from clearing the
    // trash entry re-enters reconcileLists(), which must already know this
    // id is gone for good rather than a list to be rescued.
    purgedIds.add(id);
    try {
      // Document first. If this fails, the entry stays in the trash and
      // nothing has visibly changed, so it can just be retried. Doing it
      // the other way round risks a document with no trash entry, which
      // reconcileLists() would restore as a list you meant to be rid of.
      await deleteDoc(doc(db, "packingLists", id));
      await updateDoc(indexRef, { [`deletedLists.${id}`]: deleteField() });
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the list — try again.");
    }
  }

  // ---------- Undo ----------
  const undoToast = document.getElementById("undo-toast");
  const undoToastText = document.getElementById("undo-toast-text");
  const undoToastBtn = document.getElementById("undo-toast-btn");
  let pendingUndo = null;

  let undoToastTimer = null;
  function showUndoToast(id, entry) {
    pendingUndo = { id, entry };
    undoToastText.textContent = `Deleted "${entry ? entry.name : "list"}"`;
    updateViewportInset();
    undoToast.classList.add("show");
    // It used to sit there until tapped or replaced, which read as stuck.
    // Nothing is lost when it goes -- "Recently deleted" below is the
    // permanent way back.
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(() => undoToast.classList.remove("show"), 6000);
  }

  async function performUndo() {
    if (!pendingUndo) return;
    const { id, entry } = pendingUndo;
    undoToast.classList.remove("show");
    pendingUndo = null;
    try {
      // Also clears the "recently deleted" record -- undoing means it was
      // never really deleted, so it shouldn't linger in the trash too.
      await updateDoc(indexRef, {
        [`lists.${id}`]: { name: entry ? (entry.name || "") : "", order: entry ? (entry.order ?? 0) : 0 },
        [`deletedLists.${id}`]: deleteField()
      });
    } catch (err) {
      console.error(err);
      alert("Couldn't undo — try again.");
    }
  }

  undoToastBtn.addEventListener("click", e => {
    e.stopPropagation(); // don't also trigger the document-level tap-to-add handler
    performUndo();
  });

  // Self-healing: the index is a convenience copy (names + order in a
  // single read), NOT the record of which lists exist -- the list
  // documents themselves are. A stale client running an older build, a bad
  // write, or any future bug can drop an entry from the index without
  // touching the list it points at, which used to make that list look
  // permanently gone even though all its data was sitting right there.
  //
  // So on load, enumerate the list documents and put back anything the
  // index has lost. Deliberate deletions are recorded in deletedLists, so
  // those stay deleted rather than resurrecting themselves. Documents with
  // neither a name nor any items are skipped -- an abandoned empty list
  // shouldn't reappear as a mystery row.
  // Ids purged in this session. "Delete forever" removes both the list
  // document and its trash entry -- but the enumeration below can still
  // hand back a just-deleted document from Firestore's local cache, and
  // with the trash entry already gone there is nothing left marking it as
  // deliberately deleted, so the repair pass would put it straight back as
  // a live list. That is exactly what happened: deleting forever appeared
  // to do nothing, because the list reappeared a moment later.
  const purgedIds = new Set();

  let reconciling = false;
  async function reconcileLists() {
    if (reconciling) return;
    reconciling = true;
    try {
      // From the server, not the cache. A repair pass that acts on stale
      // reads does more harm than good -- if the network is down there is
      // nothing to repair from, and the throw below simply skips it.
      const snap = await getDocsFromServer(collection(db, "packingLists"));
      const restored = {};
      let nextOrder = Object.keys(lists).length;
      snap.forEach(d => {
        const id = d.id;
        if (id === "_index") return;
        if (id in lists) return;
        if (id in deletedLists) return; // deleted on purpose -- leave it deleted
        if (purgedIds.has(id)) return;  // deleted forever in this session
        const data = d.data() || {};
        const itemCount = Object.keys(data.items || {}).length;
        if (!data.name && itemCount === 0) return;
        restored[id] = { name: data.name || "Recovered list", order: nextOrder++ };
      });
      if (Object.keys(restored).length === 0) return;
      console.warn("Restoring lists missing from the index:", Object.keys(restored));
      await setDoc(indexRef, { lists: restored }, { merge: true });
    } catch (err) {
      // Never fatal -- this is a repair pass, not the load path.
      console.error("Couldn't reconcile lists:", err);
    } finally {
      reconciling = false;
    }
  }

  // Self-initializing: the very first time this page ever loads (no index
  // document exists yet), seed it with the one list that already existed
  // before multi-list support did, so nothing needs a manual migration
  // step and no existing data is at risk.
  //
  // Two guards here, both load-bearing -- without them this seeding path
  // silently destroyed real data twice:
  //
  // 1. merge: true. A plain setDoc REPLACES the whole document, so seeding
  //    over an existing index wiped every list except "family" (their item
  //    documents survived, but they vanished from this screen, which reads
  //    only this index). Merging can only ever add the family entry back.
  // 2. Don't seed from a cache-only snapshot. Firestore delivers its first
  //    snapshot from the local cache, and on a cold or empty cache (fresh
  //    load, cleared Safari data, offline/flaky connection) that snapshot
  //    reports the document as non-existent even though the server has it.
  //    That false "it doesn't exist" is what triggered the seed in the
  //    first place, so only ever act on a confirmed server read.
  let seeding = false;
  onSnapshot(indexRef, async snap => {
    if (!snap.exists()) {
      if (snap.metadata && snap.metadata.fromCache) return; // unconfirmed -- wait for the server
      if (seeding) return;
      seeding = true;
      try {
        await setDoc(indexRef, { lists: { family: { name: "Niagara Packing List", order: 0 } } }, { merge: true });
      } catch (err) {
        console.error(err);
      }
      return; // onSnapshot fires again once that write lands
    }
    lists = snap.data().lists || {};
    deletedLists = snap.data().deletedLists || {};
    syncItemCountListeners();
    render();
    // Runs after the first real (server-confirmed) index read. Any repair
    // it makes writes to the index, which re-enters here -- by then the
    // restored entries are in `lists`, so it finds nothing and stops.
    if (!snap.metadata || !snap.metadata.fromCache) reconcileLists();
  }, err => {
    console.error(err);
    root.innerHTML = '<div class="empty-state">Couldn\'t load your lists. Check your connection and reload.</div>';
  });

  // Tap anywhere that isn't an existing list row to create a new one --
  // no separate "+" button needed. A tap that ends a pull-to-add drag
  // (below) doesn't double-fire this: preventDefault() on that drag's
  // touchmove suppresses the browser's compatibility click for it.
  document.addEventListener("click", e => {
    if (suppressNextClick) { suppressNextClick = false; return; }
    if (e.target.closest("[data-list-id]")) return;
    // The trash block is a control, not background -- tapping Restore or
    // the disclosure shouldn't also open a new-list row underneath it.
    if (e.target.closest(".trash-block")) return;
    startInlineAdd();
  });

  // ---------- Pull down to add (same gesture as the list page) ----------
  const pullWrap = document.querySelector(".wrap");
  const pullIcon = document.getElementById("pull-icon");
  const PULL_TRIGGER = 56;
  const PULL_MAX = 96;
  let pullTouchId = null;
  let pullStartY = 0;
  let pullActive = false;
  let pullDist = 0;

  function resetPull() {
    pullWrap.classList.add("pull-snap");
    pullWrap.style.transform = "";
    pullIcon.classList.add("reset");
    pullIcon.classList.remove("ready");
    pullIcon.style.opacity = 0;
    pullIcon.style.transform = "scale(0.4)";
    pullActive = false;
    pullDist = 0;
    setTimeout(() => { pullWrap.classList.remove("pull-snap"); pullIcon.classList.remove("reset"); }, 300);
  }

  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    if (window.scrollY > 0 || e.target.closest("[data-list-id], #inline-add-input")) { pullTouchId = null; return; }
    const t = e.touches[0];
    if (!t) return;
    pullTouchId = t.identifier;
    pullStartY = t.clientY;
  }, { passive: true });

  document.addEventListener("touchmove", e => {
    if (pullTouchId === null) return;
    const t = [...e.touches].find(x => x.identifier === pullTouchId);
    if (!t) return;
    if (window.scrollY > 0) { pullTouchId = null; if (pullActive) resetPull(); return; }
    const dy = t.clientY - pullStartY;
    if (dy <= 0) { if (pullActive) resetPull(); return; }
    e.preventDefault();
    pullActive = true;
    pullWrap.classList.remove("pull-snap");
    pullIcon.classList.remove("reset");
    pullDist = Math.min(PULL_MAX, dy * 0.5);
    pullWrap.style.transform = `translateY(${pullDist}px)`;
    const progress = Math.min(1, pullDist / PULL_TRIGGER);
    pullIcon.style.opacity = progress;
    pullIcon.style.transform = `scale(${0.4 + progress * 0.6})`;
    pullIcon.classList.toggle("ready", pullDist >= PULL_TRIGGER);
  }, { passive: false });

  function endPull() {
    if (pullTouchId === null) return;
    pullTouchId = null;
    const shouldAdd = pullActive && pullDist >= PULL_TRIGGER;
    resetPull();
    if (shouldAdd) startInlineAdd();
  }
  document.addEventListener("touchend", endPull);
  document.addEventListener("touchcancel", endPull);
</script>
</body>
</html>
