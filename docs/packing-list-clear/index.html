<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Lists</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9500">
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #f5f5f7;
    --ink-muted: #9a9aa2;
    --accent: #ff9500;
    --shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); overscroll-behavior-y: contain; }
  body { margin: 0; color: var(--ink); font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size: 16px; line-height: 1.4; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }

  h1 { font-weight: 700; font-size: 32px; margin: 0 0 20px; letter-spacing: -0.01em; }

  .swipe-row { position: relative; margin-bottom: 10px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); touch-action: pan-y; }
  .bg-delete {
    position: absolute; inset: 0; background: #ff3b30; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 22px; color: #fff; font-size: 15px; font-weight: 700; opacity: 0;
  }

  .list-row {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; border: none; cursor: pointer;
    padding: 20px 18px; font: inherit; font-size: 19px; font-weight: 700; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  }
  .list-row.dragging { transition: none; }
  .list-row.snap { transition: transform 0.25s cubic-bezier(.2,.9,.3,1.2); }
  .list-row.commit { transition: transform 0.2s ease-out, opacity 0.2s ease-out; }
  .list-row .chev { opacity: 0.7; font-weight: 400; flex: none; }

  .empty-state { color: var(--ink-muted); font-size: 14px; padding: 30px 4px; }

  .undo-toast {
    position: fixed; left: 14px; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: 612px; margin: 0 auto;
    background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 14px;
    padding: 14px 10px 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: var(--shadow); z-index: 10;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(16px) scale(0.98);
    transition: opacity 0.25s cubic-bezier(.2,.9,.3,1.1), transform 0.25s cubic-bezier(.2,.9,.3,1.1), visibility 0s linear 0.25s;
  }
  .undo-toast.show {
    opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1);
    transition: opacity 0.25s cubic-bezier(.2,.9,.3,1.1), transform 0.25s cubic-bezier(.2,.9,.3,1.1);
  }
  .undo-toast span { font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .undo-toast button {
    font: inherit; font-weight: 700; font-size: 14px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 8px 10px; flex: none; touch-action: manipulation;
  }

  .scroll-container { position: relative; }
  .wrap.pull-snap { transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2); }
  .pull-indicator {
    position: absolute; top: 0; left: 0; right: 0; height: 0; overflow: visible;
    display: flex; justify-content: center; pointer-events: none; z-index: 5;
  }
  #pull-icon {
    margin-top: calc(14px + env(safe-area-inset-top));
    width: 38px; height: 38px; border-radius: 50%; background: #2c2c2e; border: 1px solid #3a3a3c;
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; opacity: 0; transform: scale(0.4);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  #pull-icon.ready { background: var(--accent); border-color: var(--accent); color: #fff; }
  #pull-icon.reset { transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
</style>
</head>
<body>

<div class="scroll-container">
  <div class="pull-indicator"><div id="pull-icon">+</div></div>
  <div class="wrap">
    <h1>My Lists</h1>
    <div id="list-root"></div>
  </div>
</div>

<div id="undo-toast" class="undo-toast">
  <span id="undo-toast-text"></span>
  <button type="button" id="undo-toast-btn">Undo</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, updateDoc, deleteField, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Same Firebase project as docs/packing-list/index.html and this folder's
  // list.html. Every list lives at packingLists/{listId} (list.html?id=...
  // reads that document directly); this page just reads a small index
  // document, packingLists/_index, that names them all.
  const firebaseConfig = {
    apiKey: "AIzaSyDFJ_4r2c5P2w4F3TJg4CRNHP-yiDsRiRQ",
    authDomain: "packing-list-3c532.firebaseapp.com",
    projectId: "packing-list-3c532",
    storageBucket: "packing-list-3c532.firebasestorage.app",
    messagingSenderId: "209304705485",
    appId: "1:209304705485:web:20c59e9f08465822c58c84"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const indexRef = doc(db, "packingLists", "_index");

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
  function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

  // Same shared-gradient technique as list.html's category cards, for a
  // consistent look between the two screens.
  const GRADIENT_BASE = { h: 8, s: 80, l: 36 };
  const GRADIENT_LIGHT_CAP = 51;
  function gradientRowColor(index, total) {
    const t = total <= 1 ? 0 : index / (total - 1);
    const hue = GRADIENT_BASE.h + t * 15;
    const light = Math.min(GRADIENT_LIGHT_CAP, GRADIENT_BASE.l + t * (GRADIENT_LIGHT_CAP - GRADIENT_BASE.l));
    return `hsl(${hue.toFixed(1)}, ${GRADIENT_BASE.s}%, ${light}%)`;
  }

  const root = document.getElementById("list-root");
  let lists = {};

  function render() {
    const entries = Object.entries(lists).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
    if (entries.length === 0) {
      root.innerHTML = '<div class="empty-state">No lists yet. Tap anywhere to create one.</div>';
      return;
    }
    root.innerHTML = entries.map(([id, l], i) => `
      <div class="swipe-row" data-list-id="${escapeAttr(id)}" data-list-name="${escapeAttr(l.name || "")}">
        <div class="bg-delete">Delete</div>
        <button type="button" class="list-row" style="background:${gradientRowColor(i, entries.length)}">
          <span>${escapeHtml(l.name || "Untitled list")}</span><span class="chev">›</span>
        </button>
      </div>`).join("");
    root.querySelectorAll(".swipe-row").forEach(row => attachDeleteSwipe(row, row.dataset.listId));
  }

  root.addEventListener("click", e => {
    const row = e.target.closest("[data-list-id]");
    if (!row) return;
    location.href = `list.html?id=${encodeURIComponent(row.dataset.listId)}&name=${encodeURIComponent(row.dataset.listName)}`;
  });

  // ---------- Swipe left to delete (same gesture/confirm as list items) ----------
  const SWIPE_COMMIT_PX = 84;

  function attachDeleteSwipe(swipeRow, id) {
    const rowFg = swipeRow.querySelector(".list-row");
    const bgDelete = swipeRow.querySelector(".bg-delete");
    let startX = 0, startY = 0, dx = 0, dragging = null;
    let pointerId = null;

    rowFg.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = null;
      pointerId = e.pointerId;
      rowFg.classList.remove("snap", "commit");
    });

    rowFg.addEventListener("pointermove", e => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      const curDx = e.clientX - startX;
      const curDy = e.clientY - startY;
      if (dragging === null) {
        if (Math.abs(curDx) < 8 && Math.abs(curDy) < 8) return;
        dragging = Math.abs(curDx) > Math.abs(curDy);
        if (dragging) {
          if (rowFg.setPointerCapture) rowFg.setPointerCapture(pointerId);
          rowFg.classList.add("dragging");
        }
      }
      if (!dragging) return;
      e.preventDefault();
      dx = Math.min(0, curDx); // only leftward -- there's no "complete" direction for a list
      rowFg.style.transform = `translateX(${dx}px)`;
      bgDelete.style.opacity = String(Math.min(1, Math.abs(dx) / SWIPE_COMMIT_PX));
    });

    function endDrag(e) {
      if (pointerId === null) return;
      pointerId = null;
      if (dragging === null || !dragging) { dragging = null; return; } // plain tap -- the row's own click handles it
      rowFg.classList.remove("dragging");
      if (dx < -SWIPE_COMMIT_PX) {
        const entry = lists[id];
        const name = entry ? entry.name : "this list";
        if (confirm(`Delete "${name}"?`)) {
          rowFg.classList.add("commit");
          rowFg.style.transform = "translateX(-100%)";
          rowFg.style.opacity = "0";
          setTimeout(() => deleteList(id, entry), 150);
        } else {
          rowFg.classList.add("snap");
          rowFg.style.transform = "translateX(0)";
          bgDelete.style.opacity = "0";
        }
      } else {
        rowFg.classList.add("snap");
        rowFg.style.transform = "translateX(0)";
        bgDelete.style.opacity = "0";
      }
      dragging = null;
    }
    rowFg.addEventListener("pointerup", endDrag);
    rowFg.addEventListener("pointercancel", endDrag);
  }

  async function deleteList(id, entry) {
    try {
      await updateDoc(indexRef, { [`lists.${id}`]: deleteField() });
      showUndoToast(id, entry);
      scheduleFinalPurge(id);
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the list — try again.");
    }
  }

  // Deleting only removes a list's entry from the index above -- its actual
  // items are left alone so Undo can restore them exactly. But a "deleted"
  // list should eventually really be gone, not just hidden forever, so once
  // the undo window (below) closes without being used, permanently erase
  // its data too. Each deletion's purge runs on its own independent timer
  // (not tied to whatever the shared toast happens to be showing), so
  // deleting a second list before the first one's window closes doesn't
  // cancel the first one's purge.
  const PURGE_DELAY_MS = 6000;
  const purgeTimers = new Map(); // id -> timeout handle

  function scheduleFinalPurge(id) {
    const handle = setTimeout(() => {
      purgeTimers.delete(id);
      deleteDoc(doc(db, "packingLists", id)).catch(err => console.error(err));
    }, PURGE_DELAY_MS);
    purgeTimers.set(id, handle);
  }

  function cancelFinalPurge(id) {
    const handle = purgeTimers.get(id);
    if (handle === undefined) return;
    clearTimeout(handle);
    purgeTimers.delete(id);
  }

  // ---------- Undo ----------
  const undoToast = document.getElementById("undo-toast");
  const undoToastText = document.getElementById("undo-toast-text");
  const undoToastBtn = document.getElementById("undo-toast-btn");
  let undoTimer = null;
  let pendingUndo = null;

  function showUndoToast(id, entry) {
    pendingUndo = { id, entry };
    undoToastText.textContent = `Deleted "${entry ? entry.name : "list"}"`;
    undoToast.classList.add("show");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { undoToast.classList.remove("show"); pendingUndo = null; }, PURGE_DELAY_MS);
  }

  undoToastBtn.addEventListener("click", async e => {
    e.stopPropagation(); // don't also trigger the document-level tap-to-add handler
    if (!pendingUndo) return;
    const { id, entry } = pendingUndo;
    clearTimeout(undoTimer);
    undoToast.classList.remove("show");
    pendingUndo = null;
    cancelFinalPurge(id);
    try {
      await setDoc(indexRef, { lists: { [id]: entry } }, { merge: true });
    } catch (err) {
      console.error(err);
      alert("Couldn't undo — try again.");
    }
  });

  // Self-initializing: the very first time this page ever loads (no index
  // document exists yet), seed it with the one list that already existed
  // before multi-list support did, so nothing needs a manual migration
  // step and no existing data is at risk.
  let seeding = false;
  onSnapshot(indexRef, async snap => {
    if (!snap.exists()) {
      if (seeding) return;
      seeding = true;
      try {
        await setDoc(indexRef, { lists: { family: { name: "Niagara Packing List", order: 0 } } });
      } catch (err) {
        console.error(err);
      }
      return; // onSnapshot fires again once that write lands
    }
    lists = snap.data().lists || {};
    render();
  }, err => {
    console.error(err);
    root.innerHTML = '<div class="empty-state">Couldn\'t load your lists. Check your connection and reload.</div>';
  });

  async function createList() {
    const name = prompt("Name this list:");
    if (!name || !name.trim()) return;
    const id = uid();
    const order = Object.keys(lists).length;
    try {
      await setDoc(indexRef, { lists: { [id]: { name: name.trim(), order } } }, { merge: true });
      location.href = `list.html?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name.trim())}`;
    } catch (err) {
      console.error(err);
      alert("Couldn't create the list — try again.");
    }
  }

  // Tap anywhere that isn't an existing list row to create a new one --
  // no separate "+" button needed. A tap that ends a pull-to-add drag
  // (below) doesn't double-fire this: preventDefault() on that drag's
  // touchmove suppresses the browser's compatibility click for it.
  document.addEventListener("click", e => {
    if (e.target.closest("[data-list-id]")) return;
    createList();
  });

  // ---------- Pull down to add (same gesture as the list page) ----------
  const pullWrap = document.querySelector(".wrap");
  const pullIcon = document.getElementById("pull-icon");
  const PULL_TRIGGER = 56;
  const PULL_MAX = 96;
  let pullTouchId = null;
  let pullStartY = 0;
  let pullActive = false;
  let pullDist = 0;

  function resetPull() {
    pullWrap.classList.add("pull-snap");
    pullWrap.style.transform = "";
    pullIcon.classList.add("reset");
    pullIcon.classList.remove("ready");
    pullIcon.style.opacity = 0;
    pullIcon.style.transform = "scale(0.4)";
    pullActive = false;
    pullDist = 0;
    setTimeout(() => { pullWrap.classList.remove("pull-snap"); pullIcon.classList.remove("reset"); }, 300);
  }

  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    if (window.scrollY > 0 || e.target.closest("[data-list-id]")) { pullTouchId = null; return; }
    const t = e.touches[0];
    if (!t) return;
    pullTouchId = t.identifier;
    pullStartY = t.clientY;
  }, { passive: true });

  document.addEventListener("touchmove", e => {
    if (pullTouchId === null) return;
    const t = [...e.touches].find(x => x.identifier === pullTouchId);
    if (!t) return;
    if (window.scrollY > 0) { pullTouchId = null; if (pullActive) resetPull(); return; }
    const dy = t.clientY - pullStartY;
    if (dy <= 0) { if (pullActive) resetPull(); return; }
    e.preventDefault();
    pullActive = true;
    pullWrap.classList.remove("pull-snap");
    pullIcon.classList.remove("reset");
    pullDist = Math.min(PULL_MAX, dy * 0.5);
    pullWrap.style.transform = `translateY(${pullDist}px)`;
    const progress = Math.min(1, pullDist / PULL_TRIGGER);
    pullIcon.style.opacity = progress;
    pullIcon.style.transform = `scale(${0.4 + progress * 0.6})`;
    pullIcon.classList.toggle("ready", pullDist >= PULL_TRIGGER);
  }, { passive: false });

  function endPull() {
    if (pullTouchId === null) return;
    pullTouchId = null;
    const shouldAdd = pullActive && pullDist >= PULL_TRIGGER;
    resetPull();
    if (shouldAdd) createList();
  }
  document.addEventListener("touchend", endPull);
  document.addEventListener("touchcancel", endPull);
</script>
</body>
</html>
