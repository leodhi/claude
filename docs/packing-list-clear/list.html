      closeRevealedCat = () => close(false);
    }
    function close(instant) {
      if (instant) header.classList.remove("revealed");
      header.style.transform = "translateX(0)";
      bgDelete.style.opacity = "0";
      if (revealedCat === catName) { revealedCat = null; closeRevealedCat = null; }
      if (!instant) setTimeout(() => header.classList.remove("revealed"), 220);
    }

    bgDelete.addEventListener("click", e => {
      if (revealedCat !== catName) return;
      e.stopPropagation();
      revealedCat = null;
      closeRevealedCat = null;
      deleteCategory(catName);
    });

    header.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      dismissOnly = false;
      if (revealedCat === catName) { close(true); dismissOnly = true; }
      else if (revealedCat !== null && closeRevealedCat) { closeRevealedCat(); dismissOnly = true; }
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = null; pointerId = e.pointerId;
      header.classList.remove("snap");
    });

    header.addEventListener("pointermove", e => {
      if (pointerId === null || e.pointerId !== pointerId || catDragActive) return;
      const cdx = e.clientX - startX, cdy = e.clientY - startY;
      if (dragging === null) {
        if (Math.abs(cdx) < 8 && Math.abs(cdy) < 8) return;
        dragging = Math.abs(cdx) > Math.abs(cdy);
        if (dragging) {
          if (header.setPointerCapture) header.setPointerCapture(pointerId);
          header.classList.add("dragging");
        }
      }
      if (!dragging) return;
      e.preventDefault();
      dx = Math.min(0, cdx); // leftward only -- nothing lives to the right
      header.style.transform = `translateX(${dx}px)`;
      bgDelete.style.opacity = String(Math.min(1, Math.abs(dx) / COMMIT));
    });

    function end() {
      if (pointerId === null) return;
      pointerId = null;
      header.classList.remove("dragging");
      if (dragging === null || !dragging) {
        // A tap. If it only closed an open reveal, that's its whole job --
        // don't also collapse the category.
        if (dismissOnly) { catDragSuppressClick = true; dismissOnly = false; }
        dragging = null;
        return;
      }
      if (dx < -COMMIT) reveal();
      else { header.classList.add("snap"); header.style.transform = "translateX(0)"; bgDelete.style.opacity = "0"; }
      // A swipe is never also a collapse tap.
      catDragSuppressClick = true;
      dragging = null;
    }
    header.addEventListener("pointerup", end);
    header.addEventListener("pointercancel", end);
  }

  function attachCatDrag(header, catName, section) {
    let timer = null, startX = 0, startY = 0, pid = null, moved = false;
    header.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      pid = e.pointerId; startX = e.clientX; startY = e.clientY; moved = false;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (moved) return;
        catDragSuppressClick = true;
        startCatDrag(catName, section, startY);
      }, 400);
    });
    header.addEventListener("pointermove", e => {
      if (pid === null || e.pointerId !== pid || catDragActive) return;
      if (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) {
        moved = true;
        clearTimeout(timer);
      }
    });
    const stop = () => { clearTimeout(timer); pid = null; };
    header.addEventListener("pointerup", stop);
    header.addEventListener("pointercancel", stop);
  }

  // Which row (if any) is currently swiped open showing its delete
  // confirmation, and how to close it -- shared across all rows so opening
  // one closes whatever else was open, tap-away-to-close style.
  let revealedRowId = null;
  let closeRevealedRow = null;

  function attachSwipe(swipeRow, id) {
    const rowFg = swipeRow.querySelector(".row-fg");
    const bgComplete = swipeRow.querySelector(".bg-complete");
    const bgDelete = swipeRow.querySelector(".bg-delete");
    let startX = 0, startY = 0, dx = 0, dragging = null; // dragging: null=undetermined, true=horizontal, false=vertical(ignore)
    let pointerId = null;
    let longPressTimer = null;
    let longPressFired = false;
    let avatarTapTarget = false;
    let dismissOnly = false; // this pointerdown landed on an already-revealed row -- just close it, don't also edit

    function resetBg() {
      bgComplete.style.opacity = "0";
      bgDelete.style.opacity = "0";
    }

    // Swiping left past the threshold no longer deletes outright -- it
    // reveals the trash button and parks the row there, so an accidental
    // far swipe can't delete something without a second, deliberate tap.
    function revealForDelete() {
      if (revealedRowId !== null && revealedRowId !== id && closeRevealedRow) closeRevealedRow();
      rowFg.classList.add("revealed");
      rowFg.style.transform = `translateX(-${SWIPE_COMMIT_PX}px)`;
      bgDelete.style.opacity = "1";
      bgComplete.style.opacity = "0";
      revealedRowId = id;
      closeRevealedRow = () => closeReveal(false);
    }

    // instant=true skips the closing animation -- used when the same row
    // that's already revealed gets touched again, so a fresh drag starts
    // clean from translateX(0) instead of jumping from the revealed offset.
    function closeReveal(instant) {
      if (instant) rowFg.classList.remove("revealed");
      rowFg.style.transform = "translateX(0)";
      resetBg();
      if (revealedRowId === id) { revealedRowId = null; closeRevealedRow = null; }
      if (!instant) setTimeout(() => rowFg.classList.remove("revealed"), 220);
    }

    // The actual delete confirmation: tapping the revealed trash button.
    bgDelete.addEventListener("click", e => {
      if (revealedRowId !== id) return;
      e.stopPropagation();
      revealedRowId = null;
      closeRevealedRow = null;
      rowFg.classList.remove("revealed");
      rowFg.classList.add("commit");
      rowFg.style.transform = "translateX(-100%)";
      rowFg.style.opacity = "0";
      setTimeout(() => deleteItem(id), 150);
    });

    rowFg.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      dismissOnly = false;
      if (revealedRowId === id) {
        closeReveal(true);
        dismissOnly = true;
      } else if (revealedRowId !== null && closeRevealedRow) {
        closeRevealedRow();
      }
      if (pendingAddCat !== null || pendingEditId !== null) {
        // Another row (or the add field) is mid-edit -- this tap just
        // dismisses that, like tapping away/pressing Enter would. It
        // shouldn't ALSO start editing whatever was tapped; that takes a
        // separate, second tap once nothing else is open.
        finishAnyPendingInlineEntry();
        if (pendingRerenderNeeded) pendingRerenderNeeded = false;
        render();
        return;
      }
      // A tap on the avatar opens the assignee picker, but only once the
      // finger actually lifts (in endDrag below) -- opening it immediately
      // here, on pointerdown, means this same tap's release lands on the
      // freshly-opened sheet (which covers this same spot) and instantly
      // closes it again.
      avatarTapTarget = !!e.target.closest(".row-avatar");
      startX = e.clientX; startY = e.clientY; dx = 0; dragging = null;
      pointerId = e.pointerId;
      rowFg.classList.remove("snap", "commit");
      longPressFired = false;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (dragging !== null || avatarTapTarget) return; // already swiping/scrolling, or the avatar isn't draggable
        longPressFired = true;
        startReorderDrag(id, swipeRow, startY);
      }, 350);
    });

    rowFg.addEventListener("pointermove", e => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      if (reorderActive && reorderId === id) return; // handled by the global touchmove drag tracker
      const curDx = e.clientX - startX;
      const curDy = e.clientY - startY;
      if (dragging === null) {
        // A bit of natural finger drift while holding still shouldn't cancel
        // the long-press and force a retry -- 8px gives room for that
        // without meaningfully delaying when a real swipe kicks in.
        if (Math.abs(curDx) < 8 && Math.abs(curDy) < 8) return;
        clearTimeout(longPressTimer);
        dragging = Math.abs(curDx) > Math.abs(curDy);
        if (dragging) {
          if (rowFg.setPointerCapture) rowFg.setPointerCapture(pointerId);
          rowFg.classList.add("dragging");
        }
      }
      if (!dragging) return;
      e.preventDefault();
      dx = curDx;
      rowFg.style.transform = `translateX(${dx}px)`;
      const progress = Math.min(1, Math.abs(dx) / SWIPE_COMMIT_PX);
      if (dx > 0) { bgComplete.style.opacity = String(progress); bgDelete.style.opacity = "0"; }
      else if (dx < 0) { bgDelete.style.opacity = String(progress); bgComplete.style.opacity = "0"; }
      else resetBg();
    });

    function endDrag(e) {
      clearTimeout(longPressTimer);
      if (pointerId === null) return;
      pointerId = null;
      if (reorderActive && reorderId === id) { finishReorderDrag(); dragging = null; return; }
      if (longPressFired) { dragging = null; return; } // reorder drag already started by the long-press
      if (dragging === null) {
        // No meaningful movement -- treat as a tap. If this tap landed on
        // an already-revealed row, its pointerdown already closed the
        // reveal above -- that's the whole effect of this tap, don't also
        // open the assignee picker or edit.
        if (dismissOnly) { dismissOnly = false; return; }
        // Avatar taps open the assignee picker; anything else edits the
        // item's name inline.
        if (avatarTapTarget) {
          // The browser still fires a synthetic trailing "click" for this
          // same tap after we act on pointerup -- without suppressing it,
          // that click can land on a button in the sheet we just opened
          // (if the avatar sits where the sheet's options end up) and
          // immediately trigger it. preventDefault() on pointerup stops
          // that compatibility click from firing at all.
          if (e && e.cancelable) e.preventDefault();
          openAssigneePicker(id);
          return;
        }
        startInlineEdit(id);
        return;
      }
      if (!dragging) { dragging = null; return; } // vertical scroll gesture, ignore
      rowFg.classList.remove("dragging");
      if (dx > SWIPE_COMMIT_PX) {
        rowFg.classList.add("commit");
        rowFg.style.transform = `translateX(100%)`;
        rowFg.style.opacity = "0";
        setTimeout(() => toggleChecked(id), 150);
      } else if (dx < -SWIPE_COMMIT_PX) {
        revealForDelete();
      } else {
        rowFg.classList.add("snap");
        rowFg.style.transform = `translateX(0)`;
        resetBg();
      }
      dragging = null;
    }

    rowFg.addEventListener("pointerup", endDrag);
    rowFg.addEventListener("pointercancel", endDrag);
  }

  // Tapping anywhere outside a row that's showing its delete confirmation
  // closes it without deleting, same as tapping the row itself does. Capture
  // phase + closest() (rather than relying on each row's own listeners)
  // catches taps on completely unrelated controls -- the FAB, a category
  // header, empty space below the list -- not just other rows.
  document.addEventListener("pointerdown", e => {
    if (revealedRowId === null) return;
    if (e.target.closest && e.target.closest(`.swipe-row[data-item-id="${revealedRowId}"]`)) return;
    if (closeRevealedRow) closeRevealedRow();
  }, { capture: true });

  document.addEventListener("pointerdown", e => {
    if (revealedCat === null) return;
    if (e.target.closest && e.target.closest(".cat-header-wrap")) return;
    if (closeRevealedCat) closeRevealedCat();
  }, { capture: true });

  // ---------- Render ----------
  function render() {
    const root = document.getElementById("list-root");
    root.innerHTML = "";
    // A full rebuild detaches whatever row was showing its delete
    // confirmation, so the reference to it (and the closure that would
    // close it) goes stale -- reset the tracking, not just the DOM.
    revealedRowId = null;
    closeRevealedRow = null;
    revealedCat = null;
    closeRevealedCat = null;
    let total = 0, checkedCount = 0;

    const byCat = {};
    Object.entries(currentItems).forEach(([id, it]) => {
      (byCat[it.cat] = byCat[it.cat] || []).push({ id, ...it });
    });
    Object.values(byCat).forEach(arr => arr.sort((a, b) => {
      const rank = it => it.na ? 2 : (it.checked ? 1 : 0);
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return (a.order ?? 0) - (b.order ?? 0);
    }));

    // CUSTOM_CATEGORIES is specific to the original Niagara list ("family")
    // -- it predates multi-list support, back when this was the only list
    // that existed. Every other list starts with no preset categories at
    // all, building up its own set purely from whatever gets added via
    // "+ New category…".
    const presetCats = listId === "family" ? CUSTOM_CATEGORIES : [];
    const extraCats = Object.keys(byCat).filter(c => !presetCats.includes(c)).sort();
    let categoryOrder = [...presetCats, ...extraCats];
    // A pending inline-add on a category with literally zero items (the
    // very first item on a brand-new list, or Niagara's own "start typing"
    // fallback) needs a section to render into even though there's nothing
    // in byCat for it yet.
    if (pendingAddCat !== null && !categoryOrder.includes(pendingAddCat)) categoryOrder = [...categoryOrder, pendingAddCat];
    // Categories named via "+ Category" live in catOrder and exist before
    // anything is in them, so a new one shows up right away as an empty
    // section with its own "+ Add item" row.
    savedCatOrder.forEach(c => { if (c && !categoryOrder.includes(c)) categoryOrder = [...categoryOrder, c]; });
    // A hand-dragged order wins over the default one. Uncategorized items
    // always stay pinned at the top -- they have no heading to grab, so
    // they can't be dragged, and letting a dragged category land above
    // them would strand them somewhere unreachable. Array.sort is stable,
    // so categories with no saved position keep their default order.
    if (savedCatOrder.length) {
      const rank = new Map(savedCatOrder.map((c, i) => [c, i]));
      categoryOrder = [...categoryOrder].sort((a, b) => {
        if ((a === "") !== (b === "")) return a === "" ? -1 : 1;
        const ra = rank.has(a) ? rank.get(a) : Infinity;
        const rb = rank.has(b) ? rank.get(b) : Infinity;
        return ra === rb ? 0 : ra - rb;
      });
    }
    renderCatOptions(categoryOrder);
    // "Shown" covers both a category with items in it and one that was
    // created deliberately but is still empty.
    const isDeclared = c => c && savedCatOrder.includes(c);
    const shownCats = categoryOrder.filter(c => (byCat[c] && byCat[c].length > 0) || isDeclared(c));
    // Category chrome (headers, jump chips) only appears once a list
    // actually has more than one category -- a list that's never used the
    // feature still renders as one plain flat list, same as before it
    // existed. Niagara always shows it, even with just one category, since
    // that's how it's always looked.
    // Any named category at all earns headings: naming one is an explicit
    // ask to see it labelled. A list with nothing but loose items still
    // renders as one plain flat list, exactly as before.
    const showCatChrome = isNiagara || shownCats.some(c => c !== "");
    // Uncategorized items get no heading and no jump chip -- "No category"
    // isn't a category anyone created, it's just the absence of one, so it
    // reads as clutter. Those items simply sit loose at the top above
    // whatever real categories exist.
    const namedCats = shownCats.filter(c => c);
    document.getElementById("category-jump").style.display = showCatChrome && namedCats.length > 0 ? "" : "none";
    renderCategoryJump(namedCats);

    if (isNiagara) {
      const allAssignees = getAllAssignees();
      renderAssigneeOptions(allAssignees);
      renderAssigneeFilter(allAssignees);
    }

    if (Object.keys(currentItems).length === 0 && pendingAddCat === null) {
      root.innerHTML = '<div class="empty-state">No items yet. Tap + to add one.</div>';
    }

    let anySectionShown = false;
    // Every element that takes a colour, in the order it appears down the
    // page. Colours are handed out at the end so the fade runs once from
    // top to bottom instead of restarting inside each category.
    const tinted = [];

    categoryOrder.forEach(catName => {
      const items = byCat[catName] || [];
      const isPendingHere = pendingAddCat === catName;
      if (items.length === 0 && !isPendingHere && !isDeclared(catName)) return;
      total += items.length;
      checkedCount += items.filter(i => i.checked).length;

      let visibleItems = items;
      if (searchQuery) visibleItems = visibleItems.filter(i => i.name.toLowerCase().includes(searchQuery));
      if (assigneeFilters.size > 0) visibleItems = visibleItems.filter(i => assigneeFilters.has(i.assignee));
      // A filter or search that empties a category hides it, but an empty
      // category that was created on purpose still shows (with nothing
      // filtered, there's nothing to hide) so it can be added to.
      const filtering = !!searchQuery || assigneeFilters.size > 0;
      if (visibleItems.length === 0 && !isPendingHere && !(isDeclared(catName) && !filtering)) return;
      anySectionShown = true;

      const isCollapsed = collapsedCats.has(catName);
      const section = document.createElement("div");
      section.className = "cat-section" + (isCollapsed ? " collapsed" : "");

      const header = document.createElement("div");
      // Hidden for a list with only one category in play (or none), and
      // always for the uncategorized section. Either way the header stays
      // in the DOM -- collapse state, spread-to-insert, and drag-between-
      // categories all key off its data-cat-toggle -- it just isn't shown.
      const showThisHeader = showCatChrome && catName !== "";
      header.className = "cat-header" + (showThisHeader ? "" : " cat-header-hidden");
      header.dataset.catToggle = catName;
      if (showThisHeader) {
        tinted.push(header);
        const doneCount = items.filter(i => i.checked).length;
        header.innerHTML = `<span class="cat-title-text"><span class="cat-chevron">▾</span>${escapeHtml(catName || "No category")}</span><span class="cat-count">${doneCount} / ${items.length}</span>`;
        attachCatDrag(header, catName, section);
        // Wrapped so the heading can slide aside over a delete button,
        // the same swipe-then-tap-to-confirm used for items and lists.
        const headWrap = document.createElement("div");
        headWrap.className = "cat-header-wrap";
        const catBgDelete = document.createElement("div");
        catBgDelete.className = "cat-bg-delete";
        catBgDelete.textContent = "🗑";
        headWrap.appendChild(catBgDelete);
        headWrap.appendChild(header);
        section.appendChild(headWrap);
        attachCatSwipeDelete(headWrap, header, catBgDelete, catName);
      } else {
        section.appendChild(header);
      }

      const list = document.createElement("div");
      list.className = "row-list";



      function appendInlineAddRow() {
        const inlineRow = document.createElement("div");
        inlineRow.className = "swipe-row";
        inlineRow.innerHTML = `
          <div class="row-fg" style="background:${headerColorForCat()}">
            <div class="inline-add-input-wrap"><textarea id="inline-add-input" class="inline-add-input" rows="1" placeholder="New item"></textarea></div>
          </div>`;
        list.appendChild(inlineRow);
        tinted.push(inlineRow.querySelector(".row-fg"));
        const inlineInput = inlineRow.querySelector("#inline-add-input");

        // An untouched empty row closes itself. Opening one is supposed to
        // put you straight into typing, but iOS can refuse to focus a field
        // right after a touch gesture -- and with no keyboard and no focus
        // there is no blur to close it either, so it just sits there
        // looking like an item called "New item" (the placeholder) that
        // nobody added. Only ever fires while the field is still untouched
        // and empty, so it can't interrupt someone mid-thought.
        let idleClose = setTimeout(() => {
          if (pendingAddCat === null) return;         // already resolved
          if (inlineInput.value.trim() !== "") return; // something typed
          if (document.activeElement === inlineInput) {
            inlineInput.dataset.cancelled = "1";
            inlineInput.blur();                        // its blur handler tidies up
          } else {
            pendingAddCat = null;
            pendingAddBeforeId = null;
            if (pendingRerenderNeeded) pendingRerenderNeeded = false;
            render();
          }
        }, 6000);
        const cancelIdleClose = () => { clearTimeout(idleClose); idleClose = null; };

        inlineInput.addEventListener("input", () => {
          cancelIdleClose(); // typing means it's wanted -- never close underneath
          autoGrowInlineTextarea(inlineInput);
        });
        inlineInput.addEventListener("keydown", e => {
          if (e.key === "Enter") { e.preventDefault(); inlineInput.blur(); }
          else if (e.key === "Escape") { e.preventDefault(); inlineInput.dataset.cancelled = "1"; inlineInput.blur(); }
        });
        inlineInput.addEventListener("blur", () => {
          cancelIdleClose();
          const cancelled = inlineInput.dataset.cancelled === "1";
          const name = inlineInput.value.trim();
          const beforeId = pendingAddBeforeId;
          pendingAddCat = null;
          pendingAddBeforeId = null;
          if (!cancelled && name) commitInlineAddValue(catName, name, beforeId);
          if (pendingRerenderNeeded) { pendingRerenderNeeded = false; }
          render();
        });
      }

      if (pendingAddCat === catName && pendingAddBeforeId === null) appendInlineAddRow();

      visibleItems.forEach(item => {
        if (pendingAddCat === catName && pendingAddBeforeId === item.id) appendInlineAddRow();
        const isDone = item.checked || item.na;
        const row = document.createElement("div");
        row.className = "swipe-row";
        row.dataset.itemId = item.id;
        const isEditingThis = pendingEditId === item.id;
        row.innerHTML = `
          <div class="swipe-bg bg-complete">✓</div>
          <div class="swipe-bg bg-delete">🗑</div>
          <div class="row-fg${item.checked ? " checked" : ""}${item.na ? " na" : ""}" style="background:${isDone ? "var(--bg)" : ""}">
            ${isEditingThis
              ? `<div class="inline-add-input-wrap"><textarea id="inline-edit-input" class="inline-add-input" rows="1">${escapeHtml(item.name)}</textarea></div>`
              : `<span class="row-name">${escapeHtml(item.name)}</span>`}
            ${item.na ? '<span class="row-na-tag">N/A</span>' : ""}
            ${isNiagara ? `<span class="row-avatar${item.assignee ? "" : " unassigned"}">${item.assignee ? escapeHtml(item.assignee.slice(0, 1).toUpperCase()) : "+"}</span>` : ""}
          </div>`;
        list.appendChild(row);
        // Packed and N/A rows go dark and sit out of the sweep, so they
        // don't take a colour step and leave a gap in the fade.
        if (!isDone) tinted.push(row.querySelector(".row-fg"));
        if (isEditingThis) {
          const inlineEditInput = row.querySelector("#inline-edit-input");
          inlineEditInput.addEventListener("input", () => autoGrowInlineTextarea(inlineEditInput));
          inlineEditInput.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); inlineEditInput.blur(); }
            else if (e.key === "Escape") { e.preventDefault(); inlineEditInput.dataset.cancelled = "1"; inlineEditInput.blur(); }
          });
          inlineEditInput.addEventListener("blur", () => {
            const cancelled = inlineEditInput.dataset.cancelled === "1";
            const newName = inlineEditInput.value.trim();
            pendingEditId = null;
            if (!cancelled && newName) commitInlineEditValue(item.id, newName);
            if (pendingRerenderNeeded) { pendingRerenderNeeded = false; }
            render();
          });
        } else {
          attachSwipe(row, item.id);
        }
      });

      if (pendingAddCat === catName && pendingAddBeforeId === INSERT_AT_END) {
        appendInlineAddRow();
      } else {
        const addRow = document.createElement("div");
        addRow.className = "add-item-row";
        addRow.dataset.addCat = catName;
        addRow.textContent = "+ Add item";
        list.appendChild(addRow);
        tinted.push(addRow);
      }

      section.appendChild(list);
      root.appendChild(section);
    });

    tinted.forEach((el, i) => { el.style.background = gradientRowColor(i, tinted.length); });

    if (Object.keys(currentItems).length > 0 && !anySectionShown) {
      const q = searchInput.value.trim();
      root.innerHTML = q
        ? `<div class="empty-state">No items match "${escapeHtml(q)}".</div>`
        : `<div class="empty-state">No items match this filter.</div>`;
    }

    document.getElementById("progress-fill").style.width = total ? (checkedCount / total * 100) + "%" : "0%";
    document.getElementById("progress-label").textContent = `${checkedCount} / ${total}`;
  }

  onSnapshot(listRef, snap => {
    if (!snap.exists()) return;
    currentItems = snap.data().items || {};
    savedCatOrder = Array.isArray(snap.data().catOrder) ? snap.data().catOrder : [];
    setStatus("synced", "Synced");
    if (pendingAddCat || pendingEditId || reorderActive || catDragActive) { pendingRerenderNeeded = true; } else { render(); }
  }, err => {
    console.error(err);
    setStatus("error", "Connection error");
  });
</script>
</body>
</html>
