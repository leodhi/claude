<title>Niagara Packing List</title>
<style>
  :root {
    --paper: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #faf8f3;
    --ink: #2a2620;
    --ink-muted: #6c6558;
    --ink-faint: #a29a89;
    --border: #e3ddcf;
    --accent: #2f6f6b;
    --accent-soft: #dfeeec;
    --sun: #c2803a;
    --sun-soft: #f3e5d2;
    --good: #3a7d5c;
    --shadow: 0 1px 2px rgba(42,38,32,0.06), 0 8px 24px rgba(42,38,32,0.06);

  * { box-sizing: border-box; }
  html, body { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 72px; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  header h1 { font-family: Georgia,"Iowan Old Style","Times New Roman",serif; font-weight: 400; font-size: clamp(26px,3.6vw,34px); margin: 0 0 4px; }
  header p { margin: 0; color: var(--ink-muted); max-width: 55ch; }

  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .status.synced .dot { background: var(--good); }
  .status.syncing .dot { background: var(--sun); animation: pulse 1s ease-in-out infinite; }
  .status.error .dot { background: #b23a3a; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .undo-btn {
    font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-muted); padding: 6px 14px; font-size: 12.5px; font-weight: 600;
  }
  .undo-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .undo-btn:disabled { opacity: 0.4; cursor: default; }
  .undo-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin: 0; }
  .panel-body { padding: 18px 20px; }

  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .progress-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }
  .progress-label { font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .list-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 32px; margin-top: 16px; }
  @media (max-width: 720px) { .list-grid { grid-template-columns: 1fr; } }
  .cat-block { margin-bottom: 18px; break-inside: avoid; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; }
  .item-row:hover { background: var(--surface-2); }
  .item-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .item-row label { flex: 1; font-size: 14px; cursor: pointer; }
  .item-row.checked label { color: var(--ink-faint); text-decoration: line-through; }
  .item-row .rm, .item-row .edit { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 15px; padding: 2px 4px; flex: none; }
  .item-row .rm:hover { color: var(--sun); }
  .item-row .edit:hover { color: var(--accent); }
  .item-row .edit-input {
    flex: 1; background: var(--surface); border: 1px solid var(--accent); border-radius: 5px;
    padding: 3px 6px; color: var(--ink); font-size: 14px; font-family: inherit;
  }
  .item-row .edit-input:focus-visible { outline: none; }

  form.add-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  @media (max-width: 700px) { form.add-form { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { form.add-form { grid-template-columns: 1fr; } }
  #ci-cat-new-wrap { grid-column: 1 / -1; }
  .add-form label { display: block; font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .add-form input, .add-form select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; color: var(--ink); font-size: 14px; font-family: inherit; }
  .add-form input:focus-visible, .add-form select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-form button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 8px 14px; font-size: 13px; font-weight: 600; }
  .add-form button:hover { filter: brightness(1.08); }

  .empty { color: var(--ink-faint); font-size: 13px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .search-wrap { flex: 1; min-width: 200px; }
  .open-only-toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .open-only-toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
  #search-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; color: var(--ink); font-size: 14px; font-family: inherit; box-shadow: var(--shadow);
  }
  #search-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .viewers { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .viewer-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 8px;
  }
  .viewer-chip .avatar {
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .link-btn {
    font: inherit; cursor: pointer; border: none; background: none; color: var(--ink-faint);
    font-size: 12px; text-decoration: underline; padding: 4px 2px;
  }
  .link-btn:hover { color: var(--accent); }

  .assignee-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .assignee-chip {
    font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-muted); padding: 5px 12px; font-size: 12.5px; font-weight: 600;
  }
  .assignee-chip:hover { border-color: var(--accent); color: var(--accent); }
  .assignee-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .quick-assignees { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .quick-assignees button {
    font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-muted); padding: 3px 10px; font-size: 12px;
  }
  .quick-assignees button:hover, .quick-assignees button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .item-tag {
    font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 8px; flex: none; white-space: nowrap;
  }
  .item-row.checked .item-tag { opacity: 0.5; }

  .cat-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .cat-title-row:hover .cat-title { color: var(--accent); }
  .cat-title-row .chevron {
    font-size: 20px; line-height: 1; color: var(--ink); font-weight: 700;
    transition: transform 0.15s ease; flex: none; display: inline-block; width: 16px; text-align: center;
  }
  .cat-title-row.collapsed .chevron { transform: rotate(-90deg); }
  .cat-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sun); font-weight: 700; margin: 0; flex: 1; }
  .cat-icon { font-size: 13px; }
  .cat-done-badge { font-size: 11px; color: var(--good); font-weight: 600; white-space: nowrap; }
  .cat-block.collapsed .cat-items { display: none; }

  .fab {
    position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; font-size: 28px; line-height: 1;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); cursor: pointer; z-index: 10;
  }
  .fab:hover { filter: brightness(1.08); }
  .fab:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
    align-items: center; justify-content: center; z-index: 20; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 22px; max-width: 320px; width: 100%; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal p { margin: 0 0 14px; color: var(--ink-muted); font-size: 13px; }
  .modal input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--ink); font-size: 14px; font-family: inherit; margin-bottom: 12px;
  }
  .modal button {
    width: 100%; font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; padding: 9px 14px; font-size: 14px; font-weight: 600;
  }

</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Niagara Packing List</h1>
      <p>Tap the checkbox next to an item to mark it packed — updates appear for everyone with this link, in real time.</p>
    </div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <button type="button" id="undo-btn" class="undo-btn" disabled>Undo</button>
      <button type="button" id="redo-btn" class="undo-btn" disabled>Redo</button>
      <button type="button" id="reset-btn" class="undo-btn">New trip</button>
      <span class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search items…" aria-label="Search items">
    </div>
    <label class="open-only-toggle"><input type="checkbox" id="open-only-toggle"> Show only what's left</label>
    <div class="viewers" id="viewers"></div>
    <button type="button" id="change-name-btn" class="link-btn">Change name</button>
  </div>

  <div class="assignee-filter" id="assignee-filter"></div>

  <div class="panel">
    <div class="panel-head"><h2>Checklist</h2></div>
    <div class="panel-body">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-label" id="progress-label">0 / 0</div>
      </div>
      <div class="list-grid" id="list-grid"></div>
      <form class="add-form" id="add-form">
        <div><label for="ci-name">Item</label><input type="text" id="ci-name" placeholder="Add anything" required></div>
        <div><label for="ci-cat">Category</label><select id="ci-cat"></select></div>
        <div>
          <label for="ci-assignee">Assign to <span style="text-transform:none; font-weight:400;">(optional)</span></label>
          <input type="text" id="ci-assignee" list="assignee-list" placeholder="e.g. Elana">
          <datalist id="assignee-list"></datalist>
          <div class="quick-assignees" id="quick-assignees"></div>
        </div>
        <div id="ci-cat-new-wrap" style="display:none;"><label for="ci-cat-new">New category name</label><input type="text" id="ci-cat-new" placeholder="e.g. Beach house"></div>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>
</div>

<button type="button" id="fab-add" class="fab" aria-label="Add an item">+</button>

<div class="modal-backdrop" id="name-modal">
  <div class="modal">
    <h3>What's your name?</h3>
    <p>Shown to others viewing this list right now.</p>
    <input type="text" id="name-modal-input" placeholder="Your name" maxlength="24">
    <button type="button" id="name-modal-save">Continue</button>
  </div>
</div>

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
  function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  function setStatus(kind, text) {

  }

  const ciCatNewWrap = document.getElementById("ci-cat-new-wrap");
  const ciCatNew = document.getElementById("ci-cat-new");
  const NEW_CAT_VALUE = "__new__";
  function renderCatOptions(categories) {
    const prevValue = ciCat.value;
    ciCat.innerHTML = "";
    categories.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      ciCat.appendChild(opt);
    });
    const newOpt = document.createElement("option");
    newOpt.value = NEW_CAT_VALUE;
    newOpt.textContent = "+ New category…";
    ciCat.appendChild(newOpt);
    if (categories.includes(prevValue) || prevValue === NEW_CAT_VALUE) ciCat.value = prevValue;
  }
  renderCatOptions(CUSTOM_CATEGORIES);
  ciCat.addEventListener("change", () => {
    const isNew = ciCat.value === NEW_CAT_VALUE;
    ciCatNewWrap.style.display = isNew ? "" : "none";

      <button type="button" class="assignee-chip${assigneeFilter === n ? " active" : ""}" data-assignee-filter="${escapeAttr(n)}">${escapeHtml(n)}</button>`).join("");
  }

  function renderQuickAssignees(names) {
    const el = document.getElementById("quick-assignees");
    const assigneeInput = document.getElementById("ci-assignee");
    el.innerHTML = names.map(n => `<button type="button" data-quick-assignee="${escapeAttr(n)}">${escapeHtml(n)}</button>`).join("");
    el.querySelectorAll("[data-quick-assignee]").forEach(btn => {
      btn.classList.toggle("active", assigneeInput.value === btn.dataset.quickAssignee);
    });
  }

  function render() {
    const grid = document.getElementById("list-grid");
    grid.innerHTML = "";
    let total = 0, checkedCount = 0;

    const byCat = {};
    Object.entries(currentItems).forEach(([id, it]) => {
      (byCat[it.cat] = byCat[it.cat] || []).push({ id, ...it });
    });
    Object.values(byCat).forEach(arr => arr.sort((a, b) => {
      if (a.checked !== b.checked) return a.checked ? 1 : -1;
      return (a.order ?? 0) - (b.order ?? 0);
    }));

    const extraCats = Object.keys(byCat).filter(c => !CUSTOM_CATEGORIES.includes(c)).sort();
    const categoryOrder = [...CUSTOM_CATEGORIES, ...extraCats];
    renderCatOptions(categoryOrder);

    const usedAssignees = [...new Set(Object.values(currentItems).map(i => i.assignee).filter(Boolean))].sort();
    const allAssignees = [...new Set([...PRESET_ASSIGNEES, ...usedAssignees])];
    renderAssigneeOptions(allAssignees);
    renderAssigneeFilter(allAssignees);
    renderQuickAssignees(PRESET_ASSIGNEES);

    categoryOrder.forEach(catName => {
      const items = byCat[catName];
      if (!items || items.length === 0) return;
      total += items.length;
      checkedCount += items.filter(i => i.checked).length;

      let visibleItems = items;
      if (searchQuery) visibleItems = visibleItems.filter(i => i.name.toLowerCase().includes(searchQuery));
      if (assigneeFilter) visibleItems = visibleItems.filter(i => i.assignee === assigneeFilter);
      if (openOnly) visibleItems = visibleItems.filter(i => !i.checked);
      if (visibleItems.length === 0) return;

      const isCollapsed = collapsedCats.has(catName);
      const allDone = items.every(i => i.checked);

      const block = document.createElement("div");
      block.className = "cat-block" + (isCollapsed ? " collapsed" : "");

      const titleRow = document.createElement("div");
      titleRow.className = "cat-title-row" + (isCollapsed ? " collapsed" : "");
      titleRow.dataset.catToggle = catName;
      titleRow.innerHTML = `
        <span class="chevron">▾</span>
        <span class="cat-icon">${catIcon(catName)}</span>
        <span class="cat-title">${escapeHtml(catName)}</span>
        ${allDone ? '<span class="cat-done-badge">✓ All packed</span>' : ""}`;
      block.appendChild(titleRow);

      const itemsWrap = document.createElement("div");
      itemsWrap.className = "cat-items";

      visibleItems.forEach(item => {
        const row = document.createElement("div");
        row.className = "item-row" + (item.checked ? " checked" : "");
        const rowId = "chk-" + item.id;
        if (item.id === editingId) {
          row.innerHTML = `
            <input type="checkbox" id="${rowId}" data-id="${item.id}" ${item.checked ? "checked" : ""}>
            <input type="text" class="edit-input" data-edit-input="${item.id}" value="${escapeAttr(item.name)}">
            <input type="text" class="edit-input" data-edit-assignee="${item.id}" list="assignee-list" placeholder="Assign to…" style="flex:0 0 110px;" value="${escapeAttr(item.assignee || "")}">`;
        } else {
          row.innerHTML = `
            <input type="checkbox" id="${rowId}" data-id="${item.id}" ${item.checked ? "checked" : ""}>
            <label for="${rowId}">${escapeHtml(item.name)}</label>
            ${item.assignee ? `<span class="item-tag">${escapeHtml(item.assignee)}</span>` : ""}
            <button class="edit" data-edit="${item.id}" aria-label="Edit ${escapeHtml(item.name)}">✎</button>
            <button class="rm" data-remove="${item.id}" aria-label="Remove ${escapeHtml(item.name)}">&times;</button>`;
        }
        itemsWrap.appendChild(row);
      });
      block.appendChild(itemsWrap);
      grid.appendChild(block);
    });

    document.getElementById("progress-fill").style.width = total ? (checkedCount / total * 100) + "%" : "0%";
    document.getElementById("progress-label").textContent = `${checkedCount} / ${total}`;

    if (editingId) {
      const input = grid.querySelector(`[data-edit-input="${editingId}"]`);
      if (input) { input.focus(); input.select(); }
    }
  }

  onSnapshot(listRef, snap => {
    if (!snap.exists()) return;
    currentItems = snap.data().items || {};
    setStatus("synced", "Synced");
    if (editingId) { pendingRerender = true; } else { render(); }
  }, err => {
    console.error(err);
    setStatus("error", "Connection error");
  });

  (async function ensureSeeded() {
    const snap = await getDoc(listRef);
    if (snap.exists()) return;
    const items = {};
    SEED.forEach(([cat, name], i) => { items[uid()] = { cat, name, checked: false, order: i }; });
    await setDoc(listRef, { items });
  })().catch(err => { console.error(err); setStatus("error", "Couldn't load list"); });

  const undoBtn = document.getElementById("undo-btn");
  const redoBtn = document.getElementById("redo-btn");
  let undoStack = [];
  let redoStack = [];

  function pushAction(action) {
    undoStack.push(action);
    redoStack = [];
    updateUndoRedoButtons();
  }
  function updateUndoRedoButtons() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  async function applyInverse(action) {
    if (action.type === "toggle") {
      await updateDoc(listRef, { [`items.${action.id}.checked`]: action.from });
    } else if (action.type === "add") {
      await updateDoc(listRef, { [`items.${action.id}`]: deleteField() });
    } else if (action.type === "remove") {
      await updateDoc(listRef, { [`items.${action.id}`]: action.item });
    } else if (action.type === "edit") {
      await updateDoc(listRef, { [`items.${action.id}.name`]: action.from.name, [`items.${action.id}.assignee`]: action.from.assignee });
    }
  }
  async function applyForward(action) {
    if (action.type === "toggle") {
      await updateDoc(listRef, { [`items.${action.id}.checked`]: action.to });
    } else if (action.type === "add") {
      await updateDoc(listRef, { [`items.${action.id}`]: action.itemData });
    } else if (action.type === "remove") {
      await updateDoc(listRef, { [`items.${action.id}`]: deleteField() });
    } else if (action.type === "edit") {
      await updateDoc(listRef, { [`items.${action.id}.name`]: action.to.name, [`items.${action.id}.assignee`]: action.to.assignee });
    }
  }

  document.getElementById("list-grid").addEventListener("change", async e => {
    if (e.target.type !== "checkbox") return;
    const id = e.target.dataset.id;
    const newChecked = e.target.checked;
    setStatus("syncing", "Saving…");
    try {
      await updateDoc(listRef, { [`items.${id}.checked`]: newChecked });
      pushAction({ type: "toggle", id, from: !newChecked, to: newChecked });
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't save");
    }
  });

  function startEdit(id) {
    editingId = id;
    render();
  }
  function endEdit() {
    editingId = null;
    if (pendingRerender) { pendingRerender = false; }
    render();
  }
  async function commitEdit(id) {
    const item = currentItems[id];
    const nameInputEl = document.querySelector(`[data-edit-input="${id}"]`);
    const assigneeInputEl = document.querySelector(`[data-edit-assignee="${id}"]`);
    const newName = nameInputEl ? nameInputEl.value.trim() : (item ? item.name : "");
    const newAssignee = assigneeInputEl ? assigneeInputEl.value.trim() : (item ? (item.assignee || "") : "");
    const oldName = item ? item.name : "";
    const oldAssignee = item ? (item.assignee || "") : "";
    endEdit();
    if (!item || !newName) return;
    if (newName === oldName && newAssignee === oldAssignee) return;
    setStatus("syncing", "Saving…");
    try {
      await updateDoc(listRef, { [`items.${id}.name`]: newName, [`items.${id}.assignee`]: newAssignee });
      pushAction({ type: "edit", id, from: { name: oldName, assignee: oldAssignee }, to: { name: newName, assignee: newAssignee } });
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't save");
    }
  }

  document.getElementById("list-grid").addEventListener("click", async e => {
    const catToggle = e.target.closest("[data-cat-toggle]");
    if (catToggle) {
      const catName = catToggle.dataset.catToggle;
      if (collapsedCats.has(catName)) collapsedCats.delete(catName); else collapsedCats.add(catName);
      saveCollapsed();
      render();
      return;
    }

    const editBtn = e.target.closest("[data-edit]");
    if (editBtn) { startEdit(editBtn.dataset.edit); return; }

    const rmBtn = e.target.closest("[data-remove]");
    if (rmBtn) {
      const id = rmBtn.dataset.remove;
      const removedItem = currentItems[id];
      setStatus("syncing", "Saving…");
      try {
        await updateDoc(listRef, { [`items.${id}`]: deleteField() });
        if (removedItem) pushAction({ type: "remove", id, item: removedItem });
      } catch (err) {
        console.error(err);
        setStatus("error", "Couldn't save");
      }
    }
  });

  function editInputId(el) { return el.dataset.editInput || el.dataset.editAssignee; }
  function markEditRowCancelled(id) {
    document.querySelectorAll(`[data-edit-input="${id}"], [data-edit-assignee="${id}"]`).forEach(el => { el.dataset.cancelled = "1"; });
  }

  document.getElementById("list-grid").addEventListener("keydown", e => {
    const input = e.target.closest("[data-edit-input], [data-edit-assignee]");
    if (!input) return;
    const id = editInputId(input);
    if (e.key === "Enter") { e.preventDefault(); commitEdit(id); }
    else if (e.key === "Escape") { e.preventDefault(); markEditRowCancelled(id); endEdit(); }
  });
  document.getElementById("list-grid").addEventListener("blur", e => {
    const input = e.target.closest && e.target.closest("[data-edit-input], [data-edit-assignee]");
    if (!input || input.dataset.cancelled) return;
    const id = editInputId(input);
    if (editingId !== id) return;
    const next = e.relatedTarget;
    if (next && next.closest && next.closest("[data-edit-input], [data-edit-assignee]") && editInputId(next.closest("[data-edit-input], [data-edit-assignee]")) === id) return;
    commitEdit(id);
  }, true);

  document.getElementById("add-form").addEventListener("submit", async e => {
    e.preventDefault();
    const nameInput = document.getElementById("ci-name");
    const assigneeInput = document.getElementById("ci-assignee");
    const name = nameInput.value.trim();
    const assignee = assigneeInput.value.trim();
    const cat = ciCat.value === NEW_CAT_VALUE ? ciCatNew.value.trim() : ciCat.value;
    if (!name || !cat) return;
    const id = uid();
    const maxOrder = Math.max(0, ...Object.values(currentItems).map(it => it.order ?? 0));
    const itemData = { cat, name, assignee, checked: false, order: maxOrder + 1 };
    setStatus("syncing", "Saving…");
    try {
      await updateDoc(listRef, { [`items.${id}`]: itemData });
      pushAction({ type: "add", id, itemData });
      nameInput.value = "";
      if (ciCat.value === NEW_CAT_VALUE) ciCatNew.value = "";
      nameInput.focus();
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't save");
    }
  });

  document.getElementById("assignee-filter").addEventListener("click", e => {
    const chip = e.target.closest("[data-assignee-filter]");
    if (!chip) return;
    const name = chip.dataset.assigneeFilter;
    assigneeFilter = assigneeFilter === name ? null : name;
    render();
  });

  undoBtn.addEventListener("click", async () => {
    if (!undoStack.length) return;
    const action = undoStack.pop();
    setStatus("syncing", "Undoing…");
    try {
      await applyInverse(action);
      redoStack.push(action);
      updateUndoRedoButtons();
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't undo");
    }
  });

  redoBtn.addEventListener("click", async () => {
    if (!redoStack.length) return;
    const action = redoStack.pop();
    setStatus("syncing", "Redoing…");
    try {
      await applyForward(action);
      undoStack.push(action);
      updateUndoRedoButtons();
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't redo");
    }
  });

  // Search
  document.getElementById("search-input").addEventListener("input", e => {
    searchQuery = e.target.value.trim().toLowerCase();
    render();
  });

  // Show only what's left
  document.getElementById("open-only-toggle").addEventListener("change", e => {
    openOnly = e.target.checked;
    render();
  });

  // Quick-pick assignee buttons on the add form
  document.getElementById("quick-assignees").addEventListener("click", e => {
    const btn = e.target.closest("[data-quick-assignee]");
    if (!btn) return;
    const assigneeInput = document.getElementById("ci-assignee");
    assigneeInput.value = assigneeInput.value === btn.dataset.quickAssignee ? "" : btn.dataset.quickAssignee;
    renderQuickAssignees(PRESET_ASSIGNEES);
  });

  // Floating add button
  document.getElementById("fab-add").addEventListener("click", () => {
    const nameInput = document.getElementById("ci-name");
    nameInput.scrollIntoView({ behavior: "smooth", block: "center" });
    nameInput.focus();
  });

  // New trip: archive current state, then uncheck everything
  document.getElementById("reset-btn").addEventListener("click", async () => {
    const itemCount = Object.keys(currentItems).length;
    if (itemCount === 0) return;
    const ok = confirm("Start a new trip? This unchecks every item but keeps your list. The current state is saved as an archive first.");
    if (!ok) return;
    setStatus("syncing", "Archiving…");
    try {
      const archiveRef = doc(collection(db, "packingLists", "family", "archives"));
      await setDoc(archiveRef, { items: currentItems, archivedAt: serverTimestamp() });
      const resetUpdates = {};
      Object.keys(currentItems).forEach(id => { resetUpdates[`items.${id}.checked`] = false; });
      await updateDoc(listRef, resetUpdates);
      undoStack = [];
      redoStack = [];
      updateUndoRedoButtons();
      setStatus("synced", "Synced");
    } catch (err) {
      console.error(err);
      setStatus("error", "Couldn't reset");
    }
  });

  // Presence: who's currently viewing
  const nameModal = document.getElementById("name-modal");
  const nameModalInput = document.getElementById("name-modal-input");
  const viewersEl = document.getElementById("viewers");

  function getOrCreateDeviceId() {
    let id = localStorage.getItem("packing-device-id");
    if (!id) { id = uid() + uid(); localStorage.setItem("packing-device-id", id); }
    return id;
  }

  let currentViewerName = null;
  let presenceStarted = false;
  const presenceRef = doc(db, "packingLists", "family", "presence", getOrCreateDeviceId());

  function heartbeat() {
    if (!currentViewerName) return;
    setDoc(presenceRef, { name: currentViewerName, lastSeen: serverTimestamp() }, { merge: true }).catch(() => {});
  }

  function startPresence(viewerName) {
    currentViewerName = viewerName;
    heartbeat();
    if (presenceStarted) return;
    presenceStarted = true;
    setInterval(heartbeat, 20000);
    onSnapshot(collection(db, "packingLists", "family", "presence"), snap => {
      const now = Date.now();
      const active = [];
      snap.forEach(d => {
        const data = d.data();
        const seenMs = data.lastSeen && data.lastSeen.toMillis ? data.lastSeen.toMillis() : now;
        if (now - seenMs < 45000) active.push(data.name || "Someone");
      });
      viewersEl.innerHTML = active.map(n => `
        <span class="viewer-chip"><span class="avatar">${escapeHtml(n.slice(0, 1).toUpperCase())}</span>${escapeHtml(n)}</span>`).join("");
    });
  }

  const savedName = localStorage.getItem("packing-viewer-name");
  if (savedName) {
    startPresence(savedName);
  } else {
    nameModal.classList.add("show");
    nameModalInput.focus();
  }
  function saveViewerName() {
    const name = nameModalInput.value.trim() || "Someone";
    localStorage.setItem("packing-viewer-name", name);
    nameModal.classList.remove("show");
    startPresence(name);
  }
  document.getElementById("name-modal-save").addEventListener("click", saveViewerName);
  nameModalInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveViewerName(); } });

  document.getElementById("change-name-btn").addEventListener("click", () => {
    nameModalInput.value = currentViewerName || "";
    nameModal.classList.add("show");
    nameModalInput.focus();
    nameModalInput.select();
  });
</script>
</body>
</html>
