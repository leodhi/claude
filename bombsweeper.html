<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#5c94fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1330">
<title>BOMBSWEEPER — 1-1</title>
<style>
  :root {
    /* overworld — daytime stage */
    --sky: #5c94fc;
    --sky-band: #4a80e0;
    --block: #f6b552;
    --block-dark: #b9762a;
    --block-face: #fbd28a;
    --panel: #f8f4e8;
    --panel-2: #e9dfc4;
    --ink: #1c1c1c;
    --ink-soft: #5b5343;
    --brick: #d94f30;
    --brick-dark: #8a2f1c;
    --coin: #ffd83d;
    --pipe: #00a800;
    --pipe-dark: #006400;
    --danger: #e4000f;
    --danger-dark: #8f0009;
    --n1: #4a80e0; --n2: #00a800; --n3: #e4000f; --n4: #7b3fb3;
    --n5: #b9762a; --n6: #009999; --n7: #1c1c1c; --n8: #5b5343;
    --bevel: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* underground / castle — night stage */
      --sky: #0b1330;
      --sky-band: #060b1f;
      --block: #6b4a2f;
      --block-dark: #3a2a1a;
      --block-face: #8a6440;
      --panel: #1b1430;
      --panel-2: #2a2050;
      --ink: #f4f0e6;
      --ink-soft: #b7a9d6;
      --brick: #ff6b4a;
      --brick-dark: #a83a24;
      --coin: #ffd83d;
      --pipe: #2ee06a;
      --pipe-dark: #14803a;
      --danger: #ff5a4a;
      --danger-dark: #a12a1e;
      --n1: #7ec4ff; --n2: #2ee06a; --n3: #ff5a4a; --n4: #c79bff;
      --n5: #ffbd6b; --n6: #4adede; --n7: #f4f0e6; --n8: #b7a9d6;
    }
  }
  :root[data-theme="dark"] {
    --sky: #0b1330; --sky-band: #060b1f; --block: #6b4a2f; --block-dark: #3a2a1a;
    --block-face: #8a6440; --panel: #1b1430; --panel-2: #2a2050; --ink: #f4f0e6;
    --ink-soft: #b7a9d6; --brick: #ff6b4a; --brick-dark: #a83a24; --coin: #ffd83d;
    --pipe: #2ee06a; --pipe-dark: #14803a; --danger: #ff5a4a; --danger-dark: #a12a1e;
    --n1: #7ec4ff; --n2: #2ee06a; --n3: #ff5a4a; --n4: #c79bff;
    --n5: #ffbd6b; --n6: #4adede; --n7: #f4f0e6; --n8: #b7a9d6;
  }
  :root[data-theme="light"] {
    --sky: #5c94fc; --sky-band: #4a80e0; --block: #f6b552; --block-dark: #b9762a;
    --block-face: #fbd28a; --panel: #f8f4e8; --panel-2: #e9dfc4; --ink: #1c1c1c;
    --ink-soft: #5b5343; --brick: #d94f30; --brick-dark: #8a2f1c; --coin: #ffd83d;
    --pipe: #00a800; --pipe-dark: #006400; --danger: #e4000f; --danger-dark: #8f0009;
    --n1: #4a80e0; --n2: #00a800; --n3: #e4000f; --n4: #7b3fb3;
    --n5: #b9762a; --n6: #009999; --n7: #1c1c1c; --n8: #5b5343;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body {
    background:
      linear-gradient(var(--sky-band), var(--sky-band) 6px, transparent 6px) 0 0 / 100% 46px,
      var(--sky);
    color: var(--ink);
    font-family: "Courier New", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .pixel {
    clip-path: polygon(
      0 var(--bevel), var(--bevel) var(--bevel), var(--bevel) 0,
      calc(100% - var(--bevel)) 0, calc(100% - var(--bevel)) var(--bevel), 100% var(--bevel),
      100% calc(100% - var(--bevel)), calc(100% - var(--bevel)) calc(100% - var(--bevel)), calc(100% - var(--bevel)) 100%,
      var(--bevel) 100%, var(--bevel) calc(100% - var(--bevel)), 0 calc(100% - var(--bevel))
    );
  }

  #sheet {
    max-width: 620px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(20px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
             calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- Marquee ---------- */
  .marquee {
    text-align: center;
    padding: 10px 0 4px;
  }
  .marquee h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: var(--coin);
    text-shadow:
      3px 0 0 var(--ink), -3px 0 0 var(--ink),
      0 3px 0 var(--ink), 0 -3px 0 var(--ink),
      3px 3px 0 var(--ink), -3px -3px 0 var(--ink),
      3px -3px 0 var(--ink), -3px 3px 0 var(--ink),
      5px 6px 0 rgba(0,0,0,0.35);
  }
  .marquee p {
    margin: 6px 0 0;
    color: var(--panel);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 var(--ink);
  }

  /* ---------- HUD (status bar) ---------- */
  .hud-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .hud-bar {
    flex: 1;
    background: var(--panel);
    border: 3px solid var(--ink);
    padding: 8px 10px;
    display: flex;
    gap: 6px;
  }
  .hud-cell {
    flex: 1;
    text-align: center;
    padding: 4px 2px;
    border-right: 2px dashed var(--panel-2);
  }
  .hud-cell:last-child { border-right: none; }
  .hud-label {
    display: block;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .hud-value {
    display: block;
    font-size: 1.15rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .hud-cell.bombs .hud-value { color: var(--danger); }
  .hud-cell.time .hud-value { color: var(--n1); }
  .hud-cell.stage .hud-value { color: var(--pipe-dark); }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--panel);
    border: 3px solid var(--ink);
    padding: 12px 14px;
  }
  .panel-label {
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .world-group, .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .world-btn {
    min-height: 44px;
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: var(--block);
    border: 3px solid var(--ink);
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .world-btn .num {
    font-weight: 900;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  .world-btn .name {
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .world-btn.selected {
    background: var(--pipe);
    color: var(--panel);
  }

  .footnote {
    color: var(--ink-soft);
    font-size: 0.74rem;
    line-height: 1.45;
    margin: 10px 0 0;
    font-weight: 600;
  }
  .mode-btn {
    flex: 1;
    min-height: 44px;
    padding: 10px;
    background: var(--panel-2);
    border: 3px solid var(--ink);
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .mode-btn.active { background: var(--pipe); color: var(--panel); }

  button:focus-visible, .world-btn:focus-visible {
    outline: 3px solid var(--coin);
    outline-offset: 2px;
  }

  /* ---------- Status banner ---------- */
  .status-banner {
    display: none;
    text-align: center;
    padding: 12px;
    font-weight: 900;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 3px solid var(--ink);
  }
  .status-banner.show { display: block; }
  .status-win { background: var(--pipe); color: var(--panel); }
  .status-lose { background: var(--danger); color: var(--panel); }

  /* ---------- Reset (1-Up) button ---------- */
  .reset-btn {
    width: 52px;
    background: var(--brick);
    border: 3px solid var(--ink);
    color: var(--panel);
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    line-height: 1;
  }
  .reset-btn:active { background: var(--brick-dark); }

  /* ---------- Board ---------- */
  .board-wrap {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 3px solid var(--ink);
    padding: 10px;
  }
  .board {
    display: grid;
    gap: 3px;
    width: max-content;
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .cell {
    width: 28px;
    height: 28px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    cursor: pointer;
    padding: 0;
    color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .cell.hidden {
    background: var(--block);
    box-shadow:
      inset 3px 3px 0 var(--block-face),
      inset -3px -3px 0 var(--block-dark);
  }
  .cell.hidden::after { content: "?"; color: var(--ink); }
  .cell.hidden:active {
    box-shadow: inset 2px 2px 0 var(--block-face), inset -2px -2px 0 var(--block-dark);
  }
  .cell.hidden.flag::after { content: "\1F6A9"; font-size: 0.85rem; }
  .cell.revealed {
    background: var(--panel-2);
    box-shadow: inset 0 0 0 2px var(--panel);
    cursor: default;
  }
  .cell.mine-hit { background: var(--danger); color: var(--panel); }
  .cell.mine-hit::after, .cell.mine::after { content: "\1F4A3"; font-size: 0.85rem; }
  .cell.mine-shown { background: var(--panel-2); }
  .n1 { color: var(--n1); } .n2 { color: var(--n2); } .n3 { color: var(--n3); }
  .n4 { color: var(--n4); } .n5 { color: var(--n5); } .n6 { color: var(--n6); }
  .n7 { color: var(--n7); } .n8 { color: var(--n8); }

  @media (max-width: 420px) {
    .marquee h1 { font-size: 1.5rem; }
    .cell { width: 24px; height: 24px; font-size: 0.72rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .cell.revealed { animation: pop-in 0.1s ease-out; }
  }
  @keyframes pop-in {
    from { transform: scale(0.8); opacity: 0.5; }
    to { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="sheet">

  <div class="marquee">
    <h1>BOMBSWEEPER</h1>
    <p>Clear every block. Don't wake a bomb.</p>
  </div>

  <div class="hud-row">
    <div class="hud-bar">
      <div class="hud-cell bombs">
        <span class="hud-label">Bombs</span>
        <span class="hud-value" id="mine-counter">010</span>
      </div>
      <div class="hud-cell stage">
        <span class="hud-label">Stage</span>
        <span class="hud-value" id="tb-stage">1-1</span>
      </div>
      <div class="hud-cell time">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="timer-display">000</span>
      </div>
    </div>
    <button class="reset-btn pixel" id="btn-reset" type="button" aria-label="New game">&#8635;</button>
  </div>

  <section class="panel">
    <p class="panel-label">Select World</p>
    <div class="world-group" id="difficulty-chips"></div>
  </section>

  <div class="status-banner" id="status-banner"></div>

  <div class="board-wrap pixel">
    <div class="board" id="board"></div>
  </div>

  <section class="panel">
    <p class="panel-label">Input Mode</p>
    <div class="btn-row">
      <button class="mode-btn" id="btn-mode-reveal" type="button">Reveal Tap</button>
      <button class="mode-btn" id="btn-mode-flag" type="button">Flag Tap</button>
    </div>
    <p class="footnote">Desktop: left-click clears a block, right-click flags it. Touch: pick a mode above, or hold a block to flag it either way. First tap is always safe.</p>
  </section>

</div>

<script>
(function () {
  "use strict";

  var DIFFICULTIES = {
    "Beginner":     { rows: 9,  cols: 9,  mines: 10, stage: "1-1" },
    "Intermediate": { rows: 16, cols: 16, mines: 40, stage: "1-2" },
    "Expert":       { rows: 16, cols: 30, mines: 99, stage: "1-3" }
  };

  var state = {
    difficulty: "Beginner",
    rows: 9,
    cols: 9,
    mines: 10,
    grid: [],
    started: false,
    over: false,
    won: false,
    flagsUsed: 0,
    revealedCount: 0,
    timerHandle: null,
    timerSeconds: 0,
    tapMode: "reveal",
    longPressTimer: null
  };

  function $(id) { return document.getElementById(id); }

  function pad3(n) {
    n = Math.max(0, Math.min(999, n));
    return String(n).padStart(3, "0");
  }

  function updateStage() {
    $("tb-stage").textContent = DIFFICULTIES[state.difficulty].stage;
  }

  // ---------- World select ----------
  function renderDifficultyChips() {
    var wrap = $("difficulty-chips");
    wrap.innerHTML = "";
    Object.keys(DIFFICULTIES).forEach(function (name) {
      var d = DIFFICULTIES[name];
      var btn = document.createElement("div");
      btn.className = "world-btn" + (state.difficulty === name ? " selected" : "");
      btn.setAttribute("role", "button");
      btn.setAttribute("tabindex", "0");
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = d.stage;
      var label = document.createElement("span");
      label.className = "name";
      label.textContent = name;
      btn.appendChild(num);
      btn.appendChild(label);
      btn.addEventListener("click", function () {
        state.difficulty = name;
        state.rows = d.rows; state.cols = d.cols; state.mines = d.mines;
        renderDifficultyChips();
        updateStage();
        newGame();
      });
      wrap.appendChild(btn);
    });
  }

  // ---------- Tap mode ----------
  function renderTapMode() {
    $("btn-mode-reveal").classList.toggle("active", state.tapMode === "reveal");
    $("btn-mode-flag").classList.toggle("active", state.tapMode === "flag");
  }
  $("btn-mode-reveal").addEventListener("click", function () { state.tapMode = "reveal"; renderTapMode(); });
  $("btn-mode-flag").addEventListener("click", function () { state.tapMode = "flag"; renderTapMode(); });

  // ---------- Game setup ----------
  function newGame() {
    stopTimer();
    state.started = false;
    state.over = false;
    state.won = false;
    state.flagsUsed = 0;
    state.revealedCount = 0;
    state.timerSeconds = 0;
    state.grid = [];
    for (var r = 0; r < state.rows; r++) {
      var row = [];
      for (var c = 0; c < state.cols; c++) {
        row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
      }
      state.grid.push(row);
    }
    $("status-banner").className = "status-banner";
    $("status-banner").textContent = "";
    $("btn-reset").innerHTML = "&#8635;";
    updateMineCounter();
    updateTimerDisplay();
    renderBoard();
  }

  function placeMines(excludeR, excludeC) {
    var forbidden = new Set();
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var rr = excludeR + dr, cc = excludeC + dc;
        if (rr >= 0 && rr < state.rows && cc >= 0 && cc < state.cols) {
          forbidden.add(rr + "," + cc);
        }
      }
    }
    var placed = 0;
    while (placed < state.mines) {
      var r = Math.floor(Math.random() * state.rows);
      var c = Math.floor(Math.random() * state.cols);
      var key = r + "," + c;
      if (forbidden.has(key) || state.grid[r][c].mine) continue;
      state.grid[r][c].mine = true;
      placed++;
    }
    for (var r2 = 0; r2 < state.rows; r2++) {
      for (var c2 = 0; c2 < state.cols; c2++) {
        if (state.grid[r2][c2].mine) continue;
        var count = 0;
        for (var dr2 = -1; dr2 <= 1; dr2++) {
          for (var dc2 = -1; dc2 <= 1; dc2++) {
            if (dr2 === 0 && dc2 === 0) continue;
            var nr = r2 + dr2, nc = c2 + dc2;
            if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols && state.grid[nr][nc].mine) count++;
          }
        }
        state.grid[r2][c2].adjacent = count;
      }
    }
  }

  // ---------- Timer ----------
  function startTimer() {
    stopTimer();
    state.timerHandle = setInterval(function () {
      state.timerSeconds++;
      updateTimerDisplay();
    }, 1000);
  }
  function stopTimer() {
    if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
  }
  function updateTimerDisplay() {
    $("timer-display").textContent = pad3(state.timerSeconds);
  }
  function updateMineCounter() {
    $("mine-counter").textContent = pad3(state.mines - state.flagsUsed);
  }

  // ---------- Reveal logic ----------
  function revealCell(r, c) {
    if (state.over) return;
    var cell = state.grid[r][c];
    if (cell.revealed || cell.flagged) return;

    if (!state.started) {
      state.started = true;
      placeMines(r, c);
      startTimer();
    }

    if (cell.mine) {
      cell.revealed = true;
      loseGame(r, c);
      return;
    }

    floodReveal(r, c);
    checkWin();
    renderBoard();
  }

  function floodReveal(startR, startC) {
    var stack = [[startR, startC]];
    while (stack.length) {
      var pos = stack.pop();
      var r = pos[0], c = pos[1];
      var cell = state.grid[r][c];
      if (cell.revealed || cell.flagged || cell.mine) continue;
      cell.revealed = true;
      state.revealedCount++;
      if (cell.adjacent === 0) {
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            var nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols) {
              var ncell = state.grid[nr][nc];
              if (!ncell.revealed && !ncell.flagged && !ncell.mine) stack.push([nr, nc]);
            }
          }
        }
      }
    }
  }

  function toggleFlag(r, c) {
    if (state.over) return;
    var cell = state.grid[r][c];
    if (cell.revealed) return;
    if (cell.flagged) {
      cell.flagged = false;
      state.flagsUsed--;
    } else {
      if (state.flagsUsed >= state.mines) return;
      cell.flagged = true;
      state.flagsUsed++;
    }
    updateMineCounter();
    renderBoard();
  }

  function checkWin() {
    var totalSafe = state.rows * state.cols - state.mines;
    if (state.revealedCount >= totalSafe) {
      state.over = true;
      state.won = true;
      stopTimer();
      $("btn-reset").textContent = "\2605";
      var banner = $("status-banner");
      banner.className = "status-banner show status-win";
      banner.textContent = "Stage Clear! Swept in " + state.timerSeconds + "s";
      for (var r = 0; r < state.rows; r++) {
        for (var c = 0; c < state.cols; c++) {
          var cell = state.grid[r][c];
          if (cell.mine) cell.flagged = true;
        }
      }
      state.flagsUsed = state.mines;
      updateMineCounter();
    }
  }

  function loseGame(hitR, hitC) {
    state.over = true;
    state.won = false;
    stopTimer();
    $("btn-reset").innerHTML = "&#128163;";
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var cell = state.grid[r][c];
        if (cell.mine) cell.revealed = true;
      }
    }
    var banner = $("status-banner");
    banner.className = "status-banner show status-lose";
    banner.textContent = "Game Over — a bomb went off";
    renderBoard(hitR, hitC);
  }

  // ---------- Rendering ----------
  function renderBoard(hitR, hitC) {
    var board = $("board");
    board.style.gridTemplateColumns = "repeat(" + state.cols + ", 1fr)";
    board.innerHTML = "";
    for (var r = 0; r < state.rows; r++) {
      for (var c = 0; c < state.cols; c++) {
        var cell = state.grid[r][c];
        var btn = document.createElement("button");
        btn.type = "button";
        var cls = "cell";
        if (cell.revealed) {
          cls += cell.mine ? " revealed mine" : " revealed";
          if (cell.mine && r === hitR && c === hitC) cls += " mine-hit";
          else if (cell.mine) cls += " mine-shown";
        } else {
          cls += " hidden";
          if (cell.flagged) cls += " flag";
        }
        btn.className = cls;
        if (cell.revealed && !cell.mine && cell.adjacent > 0) {
          btn.textContent = cell.adjacent;
          btn.classList.add("n" + cell.adjacent);
        }
        attachCellEvents(btn, r, c);
        board.appendChild(btn);
      }
    }
  }

  function attachCellEvents(btn, r, c) {
    btn.addEventListener("click", function () {
      if (state.tapMode === "flag") toggleFlag(r, c);
      else revealCell(r, c);
    });
    btn.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      toggleFlag(r, c);
    });

    var pressTimer = null;
    var longPressed = false;
    btn.addEventListener("touchstart", function () {
      longPressed = false;
      pressTimer = setTimeout(function () {
        longPressed = true;
        toggleFlag(r, c);
        if (navigator.vibrate) navigator.vibrate(20);
      }, 450);
    }, { passive: true });
    var cancelPress = function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    btn.addEventListener("touchend", function (e) {
      if (longPressed) e.preventDefault();
      cancelPress();
    });
    btn.addEventListener("touchmove", cancelPress);
    btn.addEventListener("touchcancel", cancelPress);
  }

  $("btn-reset").addEventListener("click", newGame);

  // ---------- Init ----------
  var initial = DIFFICULTIES[state.difficulty];
  state.rows = initial.rows; state.cols = initial.cols; state.mines = initial.mines;
  renderDifficultyChips();
  renderTapMode();
  updateStage();
  newGame();
})();
</script>
</body>
